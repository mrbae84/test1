      }
      if (st.build === 'screentime') {
        return `${head('🔧', 'Blocking isn’t available')}
          <p class="psub">This copy of unrot couldn't get Screen Time access.</p>
          <div class="body">
            <p>Real app blocking needs the <b>Family Controls</b> capability in the app's signing profile. It looks like it's missing from this build, so unrot works on the honour system for now.</p>
            <p>The steps to set it up are in <b>ios/README.md</b>.</p>
          </div>
          <button class="btn-green sm" data-act="close">Got it</button>`;
      }
      return `${head('🧠', 'Honour system')}
        <p class="psub">This is the free build of unrot, so it can't block other apps.</p>
        <div class="body">
          <p>Spend Brain Coins in <b>Scroll</b> before you open a distracting app, and keep your word to yourself.</p>
          <p>Real blocking uses Apple's Screen Time, which needs the paid <b>Apple Developer Program</b> and the <b>Screen Time build</b> of the app. See <b>ios/README.md</b> for how to build it.</p>
          <p>Until then, you can set limits in your iPhone's own <b>Settings → Screen Time</b>.</p>
        </div>
        <button class="btn-green sm" data-act="close">Got it</button>`;
    },
  });
}

/* ================================================================
   actions (event delegation)
   ================================================================ */
const ACTIONS = {
  tab: id => {
    for (const s of stack.slice()) if (s.cls !== 'run-sheet' && s.cls !== 'unlock-sheet') closeSheet(s);
    if (!stack.length) showTab(id);
  },
  close: (_, el) => { const s = stack.find(x => x.el.contains(el) || x.bd === el); if (s) closeSheet(s); },
  confirmOk: (_, el) => { const s = sheetOf(el); if (!s) return; const cb = confirmCb; confirmCb = null; closeSheet(s); if (cb) cb(); },
  panelOk: (_, el) => { const s = sheetOf(el); if (s && s.ok) s.ok(s); },

  openCat: id => catSheet(id),
  openAct: id => openAct(id),
  openUnrots: () => unrotsSheet(),
  openScroll: () => {
    if (S.unlock && Date.now() < S.unlock.start + S.unlock.dur * MIN) {
      if (!stack.some(s => s.cls === 'unlock-sheet')) unlockSheet();
      return;
    }
    scrollSheet();
  },
  toggleMore: () => { UI.showMore = !UI.showMore; refresh(); },
  streakInfo: () => {
    const st = streakInfo();
    infoPanel('Daily Streak 🔥', [
      `Current streak: <b>${st.cur} day${st.cur === 1 ? '' : 's'}</b> · Best: <b>${st.best} day${st.best === 1 ? '' : 's'}</b>`,
      `Earn <b>${STREAK_GOAL} Brain Coins</b> in a day to keep your streak alive. Today: <b>${Math.min(st.today, STREAK_GOAL)}/${STREAK_GOAL}</b>.`,
    ]);
  },
  claimBonus: () => {
    if (S.bonusClaimed) return;
    S.bonusClaimed = true;
    award({ act: 'bonus', type: 'bonus', cat: 'bonus', title: 'Bonus Coins', icon: '🎁', coins: 30 });
    toast('First steps complete! +30 Brain Coins');
  },
  editEssential: () => openPanel({
    render: () => `<div class="grab"></div><h3>Essential Unrots</h3><p class="psub">Pick the Unrots that show on your home screen.</p>
      <div class="body">${Object.values(ACTS).filter(a => a.cat === 'timed' || a.cat === 'quest').map(a =>
        `<button class="choice ${S.essential.includes(a.id) ? 'on' : ''}" data-act="essToggle" data-id="${a.id}" aria-pressed="${S.essential.includes(a.id)}"><span style="font-size:24px">${a.icon}</span>${a.title}<span class="box">${ICON.check}</span></button>`).join('')}</div>
      <button class="btn-green sm" data-act="close">Done</button>`,
  }),
  essToggle: id => {
    S.essential = S.essential.includes(id) ? S.essential.filter(x => x !== id) : [...S.essential, id];
    save(); refresh();
  },

  // timed unrots
  pickDuration: id => durationPanel(id),
  setDuration: (v, el) => { const [id, m] = v.split(':'); S.durations[id] = Number(m); save(); closeSheet(sheetOf(el)); refresh(); },
  pickAllowed: () => (blocking() ? nativePick('pickAllowed') : appsPanel('allowed')),
  allowToggle: id => { S.allowed = S.allowed.includes(id) ? S.allowed.filter(x => x !== id) : [...S.allowed, id]; save(); refresh(); },
  actHistory: id => {
    const items = S.log.filter(e => e.act === id).sort((a, b) => b.ts - a.ts).slice(0, 30);
    openPanel({
      render: () => `<div class="grab"></div><h3>${ACTS[id].title} history</h3>
        <div class="body">${items.length ? items.map(e => `<div class="choice" style="cursor:default">${viLong(e.ts)}<span class="r">${fmtMins(e.mins)} · ${coin(18)} ${e.coins}</span></div>`).join('') : '<div class="empty">No sessions yet.</div>'}</div>
        <button class="btn-green sm" data-act="close">Close</button>`,
    });
  },
  shareOffline: async id => {
    const a = ACTS[id];
    const dur = S.active ? S.active.dur : S.durations[id] || 20;
    const text = `I'm offline for the next ${fmtDurLong(dur)} (${a.title.toLowerCase()}) 🌱 I'll get back to you after!`;
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast('Message copied. Paste it to your friends!'); } catch (_) { toast(text); }
  },
  startUnrot: id => {
    if (S.active) return;
    S.active = { id, start: Date.now(), dur: S.durations[id] || 20 };
    save();
    if (blocking()) Native.call('startSession', { minutes: S.active.dur, title: ACTS[id].title });
    closeSheet();
    runSheet();
  },
  endUnrot: () => {
    const cur = S.active;
    if (!cur) return;
    const mins = Math.floor((Date.now() - cur.start) / MIN);
    const coins = Math.floor(mins * ACTS[cur.id].rate / 60);
    confirmPanel({ title: 'End session early?', text: mins ? `You'll log ${fmtDurLong(mins)} and earn ${coins} Brain Coin${coins === 1 ? '' : 's'}.` : 'Less than a minute so far, so nothing will be logged.', ok: 'End session', danger: true }, () => finishUnrot(false));
  },

  // power ups
  finishBreath: (id, el) => {
    const s = sheetOf(el), a = ACTS[id];
    const mins = s && s.phase >= 0 ? Math.floor((Date.now() - s.start) / MIN) : 0;
    if (mins < 1) { toast('Breathe for at least 1 minute to earn coins'); return; }
    closeSheet(s);
    award({ act: id, mins, coins: mins * a.perMin, ts: s.start });
    resultPanel('😮‍💨', 'Feeling better?', `${fmtDurLong(mins)} of ${a.title.toLowerCase()} earned you ${mins * a.perMin} Brain Coins.`);
  },
  mood: (v, el) => { $$('button', el.parentElement).forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-pressed', b === el); }); },
  saveJournal: (id, el) => {
    const s = sheetOf(el), a = ACTS[id];
    const text = s.el.querySelector('textarea').value.trim();
    const mood = s.el.querySelector('.moods .on');
    if (text.length < 3) return;
    closeSheet(s);
    setCool(a);
    award({ act: id, coins: a.coins, note: (mood ? `[${mood.dataset.id}] ` : '') + text });
    resultPanel('📝', 'Entry saved', `Writing it down earned you ${a.coins} Brain Coins. Your entry stays on this device.`);
  },
  count: (d, el) => {
    const s = sheetOf(el);
    s.count = Math.max(0, s.count + Number(d));
    s.el.querySelector('.cnt').textContent = s.count;
    s.el.querySelector('.ec').textContent = `+${s.count * ACTS.pushups.per}`;
    if (navigator.vibrate) navigator.vibrate(12);
  },
  finishCount: (id, el) => {
    const s = sheetOf(el), a = ACTS[id];
    if (!s.count) { toast('Do at least one pushup first 💪'); return; }
    closeSheet(s);
    award({ act: id, coins: s.count * a.per, title: `${a.title} ×${s.count}` });
    resultPanel('💪', 'Strong brain!', `${s.count} ${a.unit}${s.count === 1 ? '' : 's'} = ${s.count * a.per} Brain Coins.`);
  },
  questInfo: () => infoPanel('Side Quests', [
    'Side quests are small real-world tasks. Snap a photo to show you did it and the brain pays you in Brain Coins.',
    'Photos never leave your device. Each quest can be done once a day.',
  ]),
  questContinue: (id, el) => {
    const s = sheetOf(el), a = ACTS[id];
    if (!s.photo) { s.questId = id; photoFor = s; $('#photo-input').click(); return; }
    closeSheet(s);
    setCool(a);
    award({ act: id, coins: a.coins });
    resultPanel(a.icon, 'Quest complete!', `${a.title}: +${a.coins} Brain Coins. Come back tomorrow for more.`);
  },

  // scrolling
  buyScroll: m => {
    if (buyOpen() || S.unlock && Date.now() < S.unlock.start + S.unlock.dur * MIN) return;
    m = Number(m);
    const cost = m * DIFFICULTY[S.difficulty].rate;
    if (S.coins < cost) { toast('Not enough Brain Coins. Go unrot first! 🌱'); return; }
    S.coins -= cost;
    logIt({ act: 'scroll', type: 'rot', cat: 'rot', title: 'Brainrot', icon: '🔓', mins: m, coins: -cost });
    S.unlock = { start: Date.now(), dur: m };
    save();
    refresh();
    // Paid time starts when the unlocked screen appears, not while the receipt is showing.
    const t0 = Date.now();
    const go = () => {
      if (S.unlock) { S.unlock.start += Date.now() - t0; save(); }
      const sc = stack.find(s => s.el.querySelector('[data-act="buyScroll"]'));
      if (sc) closeSheet(sc);
      unlockSheet();
      if (blocking()) Native.call('unlock', { minutes: m });
    };
    if (S.purchaseAnim) buyAnimation(m, cost, go); else go();
  },
  buyDone: (_, btn) => { const o = btn.closest('.buy'); if (o && o._done) o._done(); },
  doneScrolling: (_, el) => {
    const was = S.unlock;
    S.unlock = null; save();
    if (was && blocking()) Native.call('relock'); // the time-up branch already relocked
    closeSheet(sheetOf(el)); refresh();
  },

  // stats
  insteadTab: id => { UI.instead = id; refresh(); },
  chartMode: v => { const [c, m] = v.split(':'); UI.charts[c] = { mode: m, off: 0 }; refresh(); },
  chartNav: v => { const [c, d] = v.split(':'); UI.charts[c].off = Math.min(0, UI.charts[c].off + Number(d)); refresh(); },
  openCalendar: () => calendarPanel(),
  calNav: d => { UI.calMonth = Math.min(0, UI.calMonth + Number(d)); refresh(); },
  calDay: k => { UI.calSel = k; refresh(); },

  // challenges
  openChallenge: () => challengePanel(),
  startChallenge: () => { S.challenge = { start: startOfDay(Date.now()).getTime() }; save(); refresh(); toast('Challenge started. Day 1 of 28!'); },
  quitChallenge: () => {
    const finished = challengeState() && challengeState().finished;
    closeSheet();
    if (finished) { S.challenge = null; save(); refresh(); challengePanel(); return; }
    confirmPanel({ title: 'Quit the challenge?', text: 'Your progress on the 28 Day Unrot will be reset.', ok: 'Quit challenge', danger: true }, () => { S.challenge = null; save(); refresh(); });
  },

  // settings
  pickDistracting: () => (blocking() ? nativePick('pickDistracting') : Native.on ? blockingPanel() : appsPanel('distracting')),
  distToggle: id => { S.distracting = S.distracting.includes(id) ? S.distracting.filter(x => x !== id) : [...S.distracting, id]; save(); refresh(); },
  pickDifficulty: () => openPanel({
    render: () => `<div class="grab"></div><h3>Difficulty Mode</h3><p class="psub">How many Brain Coins one minute of scrolling costs.</p>
      <div class="body">${Object.entries(DIFFICULTY).map(([k, d]) => `<button class="choice ${S.difficulty === k ? 'on' : ''}" data-act="setDifficulty" data-id="${k}">${d.label}<span class="r">${d.rate} coin${d.rate > 1 ? 's' : ''} per minute</span></button>`).join('')}</div>`,
  }),
  setDifficulty: (k, el) => { S.difficulty = k; save(); closeSheet(sheetOf(el)); refresh(); },
  pickLanguage: () => openPanel({
    render: () => `<div class="grab"></div><h3>Language</h3>
      <div class="body">${Object.entries(LANGS).map(([k, l]) => `<button class="choice ${S.language === k ? 'on' : ''}" data-act="setLanguage" data-id="${k}">${l}<span class="box">${ICON.check}</span></button>`).join('')}</div>`,
  }),
  setLanguage: (k, el) => { S.language = k; save(); closeSheet(sheetOf(el)); refresh(); },
  togglePurchase: () => { S.purchaseAnim = !S.purchaseAnim; save(); refresh(); },
  editBedtime: () => textPanel({ title: 'Sleep Mode', sub: 'When do you want to put your phone away for the night?', value: S.bedtime, type: 'time' }, v => {
    if (!/^\d{2}:\d{2}$/.test(v)) { toast('Pick a time'); return; }
    S.bedtime = v; save(); closeSheet(); refresh();
  }),
  notifications: () => openPanel({
    render: () => `<div class="grab"></div><h3>Notifications</h3><p class="psub">Reminders are saved on this device.</p>
      <div class="body">${[['daily', 'Daily unrot reminder'], ['streak', 'Streak at risk'], ['bedtime', 'Bedtime wind-down']].map(([k, l]) =>
        `<div class="choice" style="cursor:default">${l}<button class="toggle" style="margin-left:auto" role="switch" aria-checked="${S.notif[k]}" aria-label="${l}" data-act="notifToggle" data-id="${k}"></button></div>`).join('')}</div>
      <button class="btn-green sm" data-act="close">Done</button>`,
  }),
  notifToggle: k => { S.notif[k] = !S.notif[k]; save(); refresh(); },
  editName: () => textPanel({ title: 'Your name', sub: 'Shown on your Unrot Bank card.', value: S.name, placeholder: 'Name' }, v => {
    v = v.trim();
    if (!v) { toast('Name can’t be empty'); return; }
    S.name = v.slice(0, 40); save(); closeSheet(); refresh();
  }),
  subscription: () => infoPanel('Subscription', ['You are on <b>unrot Free</b>. Every feature in this web version is included.']),
  weeklyRecap: () => recapPanel(),
  feedback: kind => textPanel({
    title: kind === 'feature' ? 'Request Feature' : 'Give Feedback',
    sub: kind === 'feature' ? 'What should unrot do next?' : 'How is unrot working for you?',
    multiline: true, placeholder: 'Type here…', ok: 'Save',
  }, v => {
    v = v.trim();
    if (!v) { toast('Write something first'); return; }
    S.feedback.push({ kind, text: v, ts: Date.now() });
    save(); closeSheet(); toast('Thanks! Saved on this device.');
  }),
  legal: kind => infoPanel(kind === 'privacy' ? 'Privacy Notice' : 'Terms of Service', kind === 'privacy'
    ? ['Everything you do in this app (coins, sessions, journal entries, settings) is stored only in this browser\'s local storage.', 'Nothing is sent to a server. Photos for side quests are shown on screen and never uploaded or saved.', 'Use “Delete my account” to erase all of it.']
    : ['unrot is a habit tool to help you spend less time scrolling. Brain Coins have no cash value.', 'The web version cannot block other apps; it relies on you keeping your word to yourself.']),
  deleteAccount: () => confirmPanel({ title: 'Delete my account?', text: 'This erases your coins, history, journal entries and settings from this device. It can’t be undone.', ok: 'Delete everything', danger: true }, () => {
    try { localStorage.removeItem(KEY); } catch (_) { /* ignore */ }
    if (blocking()) { Native.call('relock'); Native.call('endSession'); }
    S = blank();
    save();
    UI.showMore = false;
    showTab('home');
    toast('Account deleted. Fresh start! 🌱');
  }),
  blockOn: (_, el) => { const s = sheetOf(el); if (s && s.kind === 'onboarding') closeSheet(s); turnOnBlocking(); },
  blockPick: kind => nativePick(kind === 'allowed' ? 'pickAllowed' : 'pickDistracting'),
  blockSettings: () => Native.call('openSettings'),
  blocking: () => (Native.on ? blockingPanel() : infoPanel('Blocking Issues', [
    'Browsers can’t block other apps, so this web version works on the honour system: spend Brain Coins in <b>Scroll</b> before you open a distracting app.',
    'For hard blocking, pair it with your phone’s built-in Screen Time (iPhone) or Digital Wellbeing (Android) limits.',
  ])),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'openAct' && el.dataset.act !== 'buyScroll') return;
  const layer = el.closest('.sheet, .panel, .backdrop');
  if (layer && !layer.classList.contains('open')) return; // still animating in or out
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset.id, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || buyOpen()) return;
  const s = topSheet();
  if (s && !s.noEsc) closeSheet(s);
});
addEventListener('scroll', onScroll, { passive: true });
$('#photo-input').addEventListener('change', onPhoto);
// Another tab saved: adopt its state so this tab's next save doesn't overwrite it.
addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try {
    const d = parseState(e.newValue);
    if (!d) return;
    S = d;
    ver++;
    const run = stack.find(s => s.cls === 'run-sheet'), un = stack.find(s => s.cls === 'unlock-sheet');
    if (run && (!S.active || run.key !== S.active.start)) closeSheet(run);
    if (S.active && !stack.some(s => s.cls === 'run-sheet' && !s.closed)) { for (const x of stack.slice()) closeSheet(x); runSheet(); }
    const unlocked = S.unlock && Date.now() < S.unlock.start + S.unlock.dur * MIN;
    if (un && !S.unlock) closeSheet(un);
    if (unlocked && !un && !S.active) { for (const x of stack.slice()) closeSheet(x); unlockSheet(); }
    refresh();
  } catch (_) { /* ignore malformed writes */ }
});

/* ================================================================
   clock
   ================================================================ */
let ticks = 0, lastDay = dkey(Date.now());
function tick() {
  ticks++;
  for (const s of stack.slice()) if (s.tick && !s.closed) s.tick(s);
  const k = dkey(Date.now());
  if (k !== lastDay) { lastDay = k; ver++; refresh(); return; }
  if (ticks % 20 === 0) {
    const bed = $('#bed-card');
    if (bed && UI.tab === 'home') keepFocus($('#tab-home'), () => { bed.outerHTML = bedCard(); });
    const sig = Object.keys(S.cool).map(coolLabel).join('|');
    for (const s of stack) if (s.coolTick && !s.closed && s.coolSig !== sig) { s.coolSig = sig; drawSheet(s); }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (nativeSaveTimer) nativeSave(); return; }
  tick();
  // Screen Time access may have changed in Settings while the app was in the background.
  if (Native.on) syncNative().then(() => refresh());
});

/* ================================================================
   boot
   ================================================================ */
S = load() || seed();
save();
$$('.tabbar button').forEach(b => { b.innerHTML = ICON[{ home: 'home', stats: 'stats', challenges: 'trophy', settings: 'user' }[b.dataset.id]]; });
showTab('home');
if (S.active) {
  if (Date.now() - S.active.start >= S.active.dur * MIN) finishUnrot(true); else runSheet();
} else if (S.unlock) {
  if (Date.now() < S.unlock.start + S.unlock.dur * MIN) unlockSheet(); else { S.unlock = null; save(); }
}
setInterval(tick, 1000);

if (Native.on) {
  syncNative().then(() => {
    const st = Native.status;
    refresh();
    if (st && st.build === 'screentime' && st.screenTime === 'notDetermined' && !S.blockOnboarded) blockOnboarding();
  });
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !Native.on) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker not registered:', e)));
}
})();
</script>
</body>
</html>
