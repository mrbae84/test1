<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3fa9ee" />
<title>unrot</title>
<meta name="description" content="Earn Brain Coins by doing real-life things, spend them on scroll time." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/favicon-64.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="unrot" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
/* ============================================================
   unrot — screen-time habit app (single-file web version)
   Everything is stored in this browser's localStorage.
   ============================================================ */

/* Bricolage Grotesque (variable wght + opsz), bundled so it works offline. SIL OFL, see fonts/OFL.txt */
@font-face{
  font-family:'Bricolage Grotesque';font-style:normal;font-weight:400 800;font-stretch:100%;font-display:swap;
  src:url('fonts/bricolage-vietnamese.woff2') format('woff2');
  unicode-range:U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
}
@font-face{
  font-family:'Bricolage Grotesque';font-style:normal;font-weight:400 800;font-stretch:100%;font-display:swap;
  src:url('fonts/bricolage-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face{
  font-family:'Bricolage Grotesque';font-style:normal;font-weight:400 800;font-stretch:100%;font-display:swap;
  src:url('fonts/bricolage-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root{
  --green:#61b832;
  --green-d:#3d7e48;
  --green-l:#eafbdc;
  --green-t:#4ea428;
  --coin:#f6c22c;
  --red:#ff3b30;
  --red-l:#fde4e2;
  --orange:#f2602f;
  --ink:#111;
  --ink-2:#2a2a2a;
  --muted:#8b8b8b;
  --muted-2:#a7a7a7;
  --line:#e8e8e8;
  --chunk:#e3e3e3;
  --bg:#fff;
  --bg-2:#f6f6f6;
  --navy:#2c2c6c;
  --col:430px;
  --font:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ios:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#e7ebe6}
body{
  margin:0;
  font-family:var(--font);
  font-optical-sizing:auto;
  color:var(--ink);
  background:#e7ebe6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.3;
}
body.locked{overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
[hidden]{display:none !important}
:focus-visible{outline:3px solid #7cc4f5;outline-offset:2px}

.app{
  position:relative;
  max-width:var(--col);
  min-height:100vh;
  min-height:100dvh;
  margin:0 auto;
  background:var(--bg);
  overflow-x:hidden;
  overflow-x:clip;
  box-shadow:0 0 0 1px rgba(0,0,0,.04),0 24px 70px rgba(0,0,0,.08);
}
.tab{display:none;padding-bottom:calc(130px + var(--safe-b))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab.on{display:block;animation:tabIn .28s ease}
@keyframes tabIn{from{opacity:.4}to{opacity:1}}
.pad{padding:0 16px}

/* ---------------- shared bits ---------------- */
.h2{font-size:23px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.sec{margin:30px 0 16px}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin:28px 0 13px}
.coin{display:inline-block;vertical-align:middle}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#9a9a9a;margin:0 2px;flex:none}
.muted{color:var(--muted)}

.card{
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:22px;
}
.chunk{
  display:block;
  background:#fff;
  border:2px solid #e9e9e9;
  border-radius:22px;
  box-shadow:0 5px 0 var(--chunk);
  transition:transform .08s ease,box-shadow .08s ease;
}
button.chunk:active:not(:disabled):not(.is-off){transform:translateY(3px);box-shadow:0 2px 0 var(--chunk)}

.btn-green{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:64px;
  border:1px solid var(--green-d);border-radius:22px;
  background:var(--green);
  color:#fff;
  font-size:23px;font-weight:600;letter-spacing:-.2px;
  box-shadow:0 5px 0 var(--green-d);
  transition:transform .08s ease,box-shadow .08s ease,filter .2s;
}
.btn-green:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn-green:disabled{background:#c9c9c9;border-color:#a9a9a9;box-shadow:0 5px 0 #a9a9a9;color:#f4f4f4}
.btn-green.sm{height:52px;font-size:19px;border-radius:16px}
.btn-ghost{
  display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:18px;
  background:#f1f1f1;color:#444;font-size:18px;font-weight:600;
}
.btn-white{
  display:flex;align-items:center;justify-content:center;width:100%;height:62px;border-radius:20px;
  background:#fff;color:var(--green-d);font-size:22px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.14);
}
.btn-white:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 13px;border-radius:14px;background:#e3fdd2;color:#35701c;font-size:14px;font-weight:600;white-space:nowrap}

/* activity rows (chunky list) */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.row{
  display:flex;align-items:center;gap:15px;width:100%;
  min-height:88px;padding:15px 14px;
}
.cat-body .list{gap:10px}
.cat-body .row{border-width:1.5px;border-color:#e0e0e0;box-shadow:0 4px 0 #dfdfdf;padding:15.5px 14.5px}
#tab-home .row{min-height:86px;padding:13px 16px 13px 13px;gap:16px}
#tab-home .row-main{gap:6px}
#tab-home .row-main b{font-size:19px}
#tab-home .row .meta{font-size:17px}
.ico{
  flex:none;display:grid;place-items:center;
  width:54px;height:54px;border-radius:15px;
  background:var(--t-bg,#eee);border:1.5px solid var(--t-bd,#ccc);
  font-size:30px;line-height:1;
}
.row-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto}
.row-main b{font-size:18.5px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.row .ico{font-size:26px}
.meta{display:flex;align-items:center;gap:5px;color:#666;font-size:16.5px;flex-wrap:nowrap;white-space:nowrap;min-width:0}
.row .meta .coin{width:16px;height:16px}
.meta .pad-ic{color:#56c1e6}
.meta .pad-ic svg{width:20px;height:20px}
.meta .cd{font-size:13px;color:#6b6b6b;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta .dot:has(+ .cd){width:4px;height:4px;background:#b0b0b0}
.row.is-off{cursor:default;border-color:#eee;box-shadow:0 5px 0 #efefef}
.row.is-off .ico{opacity:.5}
.row.is-off b{color:#707070}
.row.is-off .meta .coin,.row.is-off .meta .pad-ic{opacity:.45}
.row.is-off .meta>span:first-of-type{color:#b4b4b4}

/* ---------------- home ---------------- */
.hero{position:relative;height:318px;overflow:hidden}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.wordmark{
  position:absolute;left:16px;top:calc(var(--safe-t) + 57px);
  font-size:43px;font-weight:800;color:#fff;letter-spacing:-1.5px;line-height:1;
  text-shadow:0 2px 10px rgba(0,60,120,.12);
}
.streak-pill{
  position:absolute;right:16px;top:calc(var(--safe-t) + 62px);
  display:flex;align-items:center;gap:8px;height:30px;padding:0 13px 0 11px;border-radius:16px;
  background:rgba(22,52,52,.62);color:#fff;font-size:19px;font-weight:700;
}
.streak-pill svg{width:17px;height:17px}
.hero-mascot{position:absolute;left:50%;top:calc(var(--safe-t) + 122px);width:182px;transform:translateX(-49%)}
.hero-mascot svg{width:100%;height:auto;overflow:visible}

.coins-card{display:flex;align-items:center;gap:14px;padding:19px 16px 20px 20px;margin-top:2px;border-width:1.5px;border-radius:24px}
.coins-card .coin{width:34px;height:34px}
.cc-body{flex:1;min-width:0}
.cc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cc-top b{font-size:19px;font-weight:700}
.cc-top span{font-size:15px;color:#8b8b8b;font-weight:600}
.bar{height:13px;border-radius:7px;background:#ececec;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:#3ec455;transition:width .6s cubic-bezier(.2,.8,.2,1)}

.tiles{display:grid;grid-template-columns:213fr 116fr;gap:14px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:116px;border-radius:24px}
.tile svg{width:42px;height:42px}
.tile span{font-size:16px;font-weight:500}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px}
.quick .sq{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:22px}
.quick .sq svg{width:31px;height:31px}
.quick span{font-size:14px;font-weight:500}
.quick-h{font-size:19px;margin-bottom:11px}

.steps-card{position:relative;margin-top:20px;padding:18px 20px 20px;border-radius:24px}
.steps-card h3{font-size:23px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.steps-card p{margin:13px 0 10px;font-size:15px;color:#8b8b8b;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:14px;padding:10px 0}
.step .ck{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e9e9e9;color:#fff;flex:none}
.step.done .ck{background:#5bb833;color:#fff;text-decoration:none}
.step .ck svg{width:20px;height:20px}
.step span{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done span{color:#8f8f8f;text-decoration:line-through;text-decoration-thickness:2px}
.go{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);flex:none}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.go svg{width:20px;height:20px}
.step .go{margin-left:26px}
.steps-card .btn-green{width:calc(100% + 9px);margin:18px -4.5px 0;height:64px;font-size:24px}
.tape{
  position:absolute;right:-30px;top:-12px;transform:rotate(9deg);
  display:flex;align-items:center;gap:5px;padding:5px 26px 5px 18px;
  background:#f8eeac;color:#222;font-size:15px;font-weight:700;
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 18%,100% 32%,96% 50%,100% 66%,96% 82%,100% 100%,0 100%,4% 84%,0 66%,4% 50%,0 32%,4% 16%);
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.streak-card{display:flex;align-items:center;gap:14px;margin-top:26px;padding:13px 14px;border-radius:24px;background:#fff6f2}
.streak-card .ring{position:relative;width:54px;height:54px;flex:none}
.streak-card .ring svg{width:54px;height:54px}
.streak-card .ring .em{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.streak-card .st b{display:block;font-size:18.5px;font-weight:700;color:var(--orange)}
.streak-card .st span{display:block;margin-top:4px;max-width:200px;font-size:14px;color:#f0743e;line-height:1.3}
.streak-card.done{background:#f0fbe9}
.streak-card.done .st b{color:#43a41d}
.streak-card.done .st span{color:#5bb833}

.bed-card{display:flex;align-items:center;gap:16px;width:100%;margin-top:24px;padding:16px 18px;border-radius:24px;background:#fafafa;border:1.5px solid #f0f0f0;text-align:left}
.moon{width:50px;height:50px;flex:none}
.bed-card .t{flex:1;min-width:0}
.bed-card b{display:block;font-size:25px;font-weight:800;letter-spacing:-.4px}
.bed-card .t>span{display:block;font-size:14.5px;color:#8b8b8b;margin-top:2px}
.bed-ring{position:relative;width:56px;height:56px;flex:none}
.bed-ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.bed-ring em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:700;color:#4a5a7d}

.pill-btn{height:34px;padding:0 22px;border-radius:17px;background:#ececec;font-size:15px;font-weight:600}
.more{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;padding:6px 14px;font-size:16px;font-weight:500;color:#8b8b8b}
.more svg{width:18px;height:18px;transition:transform .2s}
.more.open svg{transform:rotate(180deg)}

.log-bar{padding:15px 15px 14px;border-radius:24px}
.split{display:flex;gap:3px;height:26px}
.split i{display:flex;align-items:center;justify-content:center;min-width:20px;border-radius:4px;color:#fff;font-style:normal;font-size:15px;font-weight:700;overflow:hidden;white-space:nowrap}
.split i:first-child{border-top-left-radius:13px;border-bottom-left-radius:13px}
.split i:last-child{border-top-right-radius:13px;border-bottom-right-radius:13px}
.split .g{background:#5bb833}
.split .r{background:#e04440}
.split .e{background:#eee;flex:1}
.legend{display:flex;gap:28px;margin-top:12px;padding-left:6px;font-size:17px;color:#8b8b8b}
.legend span{display:flex;align-items:center;gap:8px}
.legend span::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c)}
.log-bar .legend{gap:24px;margin-top:6px;padding-left:4px;font-size:15px}
.log-bar .legend span{gap:7px}
.log-bar .legend span::before{width:10px;height:10px}
.timeline{margin-top:12px;padding:6px 22px 0 16px;border-radius:24px}
.tl{position:relative;display:flex;align-items:center;gap:17px;padding:20px 0 20px 34px}
.tl::before{content:"";position:absolute;left:-3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--c)}
.tl:not(:last-child)::after{content:"";position:absolute;left:2px;top:calc(50% + 10px);height:calc(100% - 20px);border-left:2px dotted #d4d4d4}
.tl .ico{width:42px;height:42px;border:0;border-radius:11px;font-size:22px}
.tl .tx{flex:1;min-width:0}
.tl b{display:block;font-size:18px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.tl .meta{font-size:15px;margin-top:4px;overflow:hidden}
.tl .meta .tm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tl .meta svg{width:18px;height:18px}
.tl .amt{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;color:#555;white-space:nowrap}
.tl .amt .coin{width:22px;height:22px}
.empty{padding:22px 8px;text-align:center;color:#9a9a9a;font-size:16px}

/* ---------------- stats ---------------- */
.reclaim{padding:calc(var(--safe-t) + 58px) 24px 0;text-align:center;font-size:25px;line-height:1.2;font-weight:500;letter-spacing:-.3px}
.reclaim strong{color:#5bb833;font-weight:800}
.bank{position:relative;margin-top:46px;aspect-ratio:343/240;border-radius:22px;overflow:hidden;color:#fff;box-shadow:0 10px 30px rgba(40,120,60,.18)}
.bank .scene{position:absolute;inset:0;width:100%;height:100%}
.bank .bn{position:absolute;left:12px;top:16px;font-size:16px;font-weight:700;letter-spacing:.1px}
.bank .chip{position:absolute;right:12px;top:20px;width:36px;height:29px}
.bank .bm{position:absolute;left:50%;top:30%;width:28%;transform:translateX(-50%)}
.bank .bm svg{width:100%;height:auto}
.bank .ch{position:absolute;left:12px;right:120px;bottom:14px}
.bank .ch small{display:block;font-size:11px;font-weight:500;opacity:.95;letter-spacing:.2px}
.bank .ch b{display:block;margin-top:2px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bank .num{position:absolute;right:12px;bottom:15px;font-size:16px;font-weight:600;letter-spacing:.3px}
.life{margin-top:26px;padding:16px 20px;border-radius:22px;background:#f7f7f7}
.life .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.life small{font-size:13.5px;font-weight:600;color:#8b8b8b;letter-spacing:.3px}
.life em{font-style:normal;color:#5bb833;font-size:14px;font-weight:500;text-align:right}
.life .v{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:27px;font-weight:800}
.life .v .coin{width:22px;height:22px}
.big-h{font-size:22px;font-weight:700;letter-spacing:-.2px;line-height:1.2;margin:56px 0 18px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button{height:36px;border-radius:18px;font-size:14px;font-weight:600;color:#666;text-align:center}
.seg2 button.on{background:#eefbe3;color:var(--green-t)}
.pu-list{display:grid;gap:12px;margin-top:16px}
.pu{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:#f7f7f7}
.pu .ico{width:54px;height:54px;border:0;border-radius:14px}
.pu .tx{flex:1;min-width:0}
.pu b{display:block;font-size:16px;font-weight:700}
.pu .tx>span{display:block;font-size:13px;color:#7f7f7f;margin-top:2px}
.pu .amt{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700}
.pu .amt .coin{width:18px;height:18px}

.patterns{display:flex;gap:13px;margin:0 -16px;padding:2px 16px 8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none}
.pcol{display:flex;flex-direction:column;gap:15px;width:142px;flex:none;scroll-snap-align:start}
.patterns::-webkit-scrollbar{display:none}
.pc{display:flex;flex-direction:column;justify-content:space-between;padding:22px 20px 20px;border-radius:22px;background:var(--pc)}
.pc.tall{height:184px}
.pc.short{display:grid;grid-template-columns:auto 1fr;align-content:center;align-items:start;column-gap:8px;padding:0 8px 0 14px;height:81px}
.pc .em{font-size:25px;line-height:1}
.pc .em svg:not(.coin){width:28px;height:28px}
.pc.short .em{font-size:22px;line-height:23px}
.pc .em .coin{width:28px;height:28px}
.pc b{display:block;font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.2px}
.pc .lab{display:block;font-size:12.5px;color:#9a9a9a;margin-top:3px;line-height:1.15}
.pc small{display:block;font-size:9.5px;color:#9a9a9a;margin-top:3px}
.pc.short .tx{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
.pc.short b{font-size:20px;white-space:nowrap;line-height:23px}
.pc.short .lab{font-size:11.5px;margin-left:4px}
.pc .vrow{display:flex;align-items:center;gap:6px}
.pc .vrow .coin{width:20px;height:20px}

.chart{margin-top:20px;padding:20px 20px 18px;border:2px solid #ececec;border-radius:24px}
.big-h+.chart{margin-top:12px}
.chart .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chart .ttl{font-size:15px;font-weight:700;color:#8a8a8a}
.badge{display:flex;align-items:center;gap:7px}
.badge .ar{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bc);color:#fff}
.badge .ar svg{width:12px;height:12px}
.badge b{display:block;font-size:18px;font-weight:800;line-height:1}
.badge small{display:block;font-size:10px;color:#333;margin-top:2px}
.chart .vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
.chart .val{display:flex;align-items:center;gap:10px;font-size:35px;line-height:1.15;font-weight:800;letter-spacing:-1px}
.chart .val .vi{width:32px;height:32px;display:grid;place-items:center}
.chart .val .vi svg{width:32px;height:32px}
.seg{display:flex;padding:3.5px;border-radius:17px;background:#e7e6eb}
.seg button{height:26px;padding:0 14.5px;border-radius:13px;font-size:13px;font-weight:600;color:#8b8b8b}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:7px -10px 0}
.nav button{display:grid;place-items:center;width:28px;height:28px;color:#8a8a8a}
.nav button:disabled{opacity:.35}
.nav button svg{width:18px;height:18px}
.nav span{font-size:13px;font-weight:600}
.plot{position:relative;display:flex;gap:6px;height:164px;padding-top:8px}
.plot .cols{position:relative;flex:1;display:grid;grid-template-columns:repeat(var(--n),1fr);column-gap:var(--gap,10px);align-items:end}
.plot .grid{position:absolute;left:0;right:0;border-top:1px solid #f1f1f1}
.plot .colw{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;padding-bottom:16px}
.plot .b{border-radius:var(--br,10px);background:var(--c);min-height:4px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.plot .b.z{background:var(--p);height:2px !important;min-height:0;border-radius:1px}
.plot .lb{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:9.5px;line-height:12px;color:#9a9a9a;white-space:nowrap}
.plot .axis{position:relative;width:22px;font-size:9.5px;color:#9a9a9a}
.plot .axis span{position:absolute;right:0;transform:translateY(50%)}
.cal-link{display:flex;align-items:center;gap:8px;width:100%;margin-top:36px;padding:19px 16px;border-radius:22px}
.cal-link .em{font-size:26px;line-height:1}
.cal-link b{flex:1;font-size:18px;font-weight:700}
.cal-link svg{width:26px;height:26px;color:#777}

/* ---------------- challenges ---------------- */
.ch-title{padding:calc(var(--safe-t) + 58px) 24px 0;font-size:35px;font-weight:800;letter-spacing:-.5px}
.ch-label{margin:29px 24px 16px;font-size:14px;font-weight:600;color:#7a7a7a;letter-spacing:.4px}
.ch-card{position:relative;display:block;width:calc(100% - 48px);margin:0 24px;height:180px;border-radius:26px;overflow:hidden;color:#fff;text-align:left}
.ch-card .scene{position:absolute;inset:0;width:100%;height:100%}
.ch-card .tx{position:absolute;left:20px;bottom:21px}
.ch-card b{display:block;font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.3px}
.ch-card .tx>span{display:block;margin-top:9px;font-size:14px;font-weight:500;line-height:1.2}
.ch-card .bm{position:absolute;right:32px;bottom:13px;width:34%}
.ch-card .bm svg{width:100%;height:auto}
.ch-card .prog{position:absolute;left:20px;right:20px;bottom:9px;height:6px;border-radius:3px;background:rgba(255,255,255,.35)}
.ch-card .prog i{display:block;height:100%;border-radius:4px;background:#fff}
.soon{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:64px;color:#606060;font-size:18px;font-weight:600}
.soon svg{width:40px;height:40px}

/* ---------------- settings (iOS look) ---------------- */
.tab-settings{background:#f4f4f4;font-family:var(--ios);padding-bottom:calc(175px + var(--safe-b))}
.set-bar{
  position:sticky;top:0;z-index:5;
  padding:calc(var(--safe-t) + 52px) 16px 21px;text-align:center;
  font-size:17px;font-weight:600;letter-spacing:-.2px;
  background:#f4f4f4;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.set-bar.show{opacity:1}
.set-title{margin-top:calc(-95px - var(--safe-t));padding:calc(var(--safe-t) + 99px) 16px 0;font-size:34px;font-weight:700;letter-spacing:.2px}
.set-h{margin:27px 16px 22px;font-size:20px;font-weight:600}
.set-title+.set-h{margin-top:22px}
.group{margin:0 16px;border-radius:22px;background:#fff;overflow:hidden}
.srow{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:74px;padding:14px 16px 14px 20px;text-align:left}
.srow+.srow::before{content:"";position:absolute;left:72px;right:0;top:0;border-top:.5px solid #d9d9d9}
.srow:active{background:#f2f2f2}
.si{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--sb);font-size:24px;flex:none}
.srow .tx{flex:1;min-width:min-content}
.srow b{display:block;font-size:17.5px;font-weight:500;letter-spacing:-.2px}
.srow small{display:block;margin-top:3px;font-size:13px;color:#8a8a8a;line-height:1.2}
.srow .val{font-size:17px;color:#8a8a8a;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.srow .val.sb{font-size:14.5px;font-weight:600}
.srow .chev{display:block;width:18px;height:18px;margin-left:-5px;color:#9b9b9b;flex:none}
.chev svg{width:100%;height:100%}
.srow.danger b{color:#ff3b30}
.spill{display:inline-flex;align-items:center;height:25px;padding:0 11px;border-radius:8px;background:#e4f3db;color:#58b40f;font-size:14px;font-weight:600;white-space:nowrap}
.apps-stack{display:flex;align-items:center}
.apps-stack i{width:21px;height:21px;border-radius:6px;margin-left:-7px;border:1px solid #fff;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;font-weight:700}
.apps-stack i:first-child{margin-left:0}
.apps-stack span{margin-left:3px;font-size:15px;font-weight:700}
.note{position:relative;display:flex;gap:10px;align-items:center;margin:0;padding:13px 18px 10px;color:#8a8a8a;font-size:13px;line-height:1.2;background:#fff}
.note::before{content:"";position:absolute;left:72px;right:0;top:0;border-top:.5px solid #d9d9d9}
.note svg{width:16px;height:16px;margin:0 0 0 6px;color:#9a9a9a;flex:none}
.toggle{position:relative;width:62px;height:28px;border-radius:14px;background:#e3e3e3;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:37px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .2s}
.toggle[aria-checked="true"]{background:#34c759}
.toggle[aria-checked="true"]::after{transform:translateX(21px)}

/* ---------------- tab bar ---------------- */
.tabbar{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 22px);z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;
  width:min(310px,calc(100vw - 64px));height:78px;padding:0 10px;transform:translateX(-50%);
  border-radius:39px;background:rgba(92,92,92,.86);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.12);
}
.tabbar button{display:grid;place-items:center;height:56px;width:56px;margin:auto;border-radius:50%;color:#c3c3c3;transition:background .2s,color .2s}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{background:rgba(255,255,255,.2);color:#fff}

/* ---------------- sheets ---------------- */
.sheet{
  position:fixed;top:0;bottom:0;left:0;right:0;z-index:60;
  width:min(100%,var(--col));margin:0 auto;
  transform:translateY(100%);
  background:#fff;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  transition:transform .38s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.sheet.open{transform:none}
.sheet:focus,.panel:focus{outline:none}
.x-btn{
  position:absolute;right:20px;top:calc(var(--safe-t) + 48px);z-index:3;
  display:grid;place-items:center;width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.13);color:#fff;
}
.x-btn svg{width:25px;height:25px}
.x-btn svg path{stroke-width:2.2}
.sheet>.x-btn{position:sticky;top:calc(var(--safe-t) + 48px);right:auto;flex:none;align-self:flex-end;margin:calc(var(--safe-t) + 48px) 20px calc(-84px - var(--safe-t)) 0}
.cat-head{position:relative;flex:none;height:270px;background:var(--hb)}
.cat-head,.act-head{overflow-x:clip}
.cat-head.compact{height:139px}
.curve{position:absolute;left:-11%;right:-11%;bottom:-1px;height:40px;border-radius:50% 50% 0 0/100% 100% 0 0;background:#fff}
.cat-mascot{position:absolute;left:50%;bottom:-28px;width:164px;transform:translateX(-50%);z-index:2}
.cat-head.compact .cat-mascot{bottom:-45px;width:172px}
.cat-mascot svg{width:100%;height:auto;overflow:visible}
.cat-body{flex:1;padding:52px 16px calc(40px + var(--safe-b))}
.cat-head.compact+.cat-body{padding-top:54px}
.cat-body h1{text-align:center;font-size:26px;font-weight:800;letter-spacing:-.2px;line-height:1.25}
.cat-body .sub{margin:6px auto 24px;max-width:320px;text-align:center;color:#858585;font-size:16px;line-height:1.22}

.act-head{position:relative;flex:none;height:250px;background:var(--green)}
.act-head .curve{left:-7%;right:-7%;height:72px}
.act-emoji{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:88px;line-height:1;z-index:2}
.circ{position:absolute;top:calc(var(--safe-t) + 62px);z-index:3;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff}
.circ svg{width:22px;height:22px}
.circ.l{left:22px}
.circ.r{right:20px;top:calc(var(--safe-t) + 65px);width:34px;height:34px}
.circ.r svg{width:18px;height:18px}
.act-body{flex:1;padding:0 16px 28px}
.act-body h1{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;margin:16px -16px 32px}
.stats3>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0}
.stats3>div+div{border-left:1px solid #d6d6d6}
.stats3 b{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.stats3 b .coin{width:13px;height:13px}
.stats3 span{font-size:13px;color:#7f7f7f}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 15px;margin-bottom:16px;border-color:#dedede;border-radius:24px}
.opt .ico{width:44px;height:44px;border:0;border-radius:12px;background:#e3fdd6;color:#888}
.opt .ico svg{width:24px;height:24px}
.opt .tx{flex:1;min-width:0}
.opt b{display:block;font-size:17px;font-weight:700;line-height:1.25}
.opt .tx>span{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:13px;color:#7f7f7f;line-height:1.2}
.opt .pill{font-style:normal;flex:none}
.opt span .coin{width:13px;height:13px}
.opt .chev{display:block;width:16px;height:16px;color:#8a8a8a;flex:none}
@media (max-width:360px){.opt{gap:10px;padding:12px}.opt .pill{padding:0 10px}}
.act-foot{position:sticky;bottom:0;padding:24px 16px max(44px, calc(var(--safe-b) + 10px));background:linear-gradient(rgba(255,255,255,0),#fff 20px)}
.link-green{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-bottom:8px;color:#58b22d;font-size:16px;font-weight:600}
.link-green svg{width:18px;height:18px}

/* quest (photo) */
.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--safe-t) + 55px) 18px 0}
.q-top h2{font-family:var(--ios);font-size:17px;font-weight:400;text-align:center;flex:1}
.q-info{display:grid;place-items:center;width:28px;height:28px;color:#8a8a8a}
.q-info svg{width:28px;height:28px}
.q-x{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#8e8e93;color:#fff}
.q-x svg{width:16px;height:16px}
.q-chat{display:flex;align-items:center;gap:30px;padding:22px 20px 0}
.q-chat .bm{width:82px;flex:none}
.q-chat .bm svg{width:100%;height:auto}
.bubble{flex:0 1 auto;max-width:180px;padding:16px;border:1.5px solid #d4d4d4;border-radius:32px;font-size:18.5px;font-weight:500;line-height:1.3;letter-spacing:-.2px}
.q-art{position:relative;flex:none;align-self:center;width:min(calc(100% - 48px), calc(100dvh - 400px - var(--safe-t) - var(--safe-b)));margin:60px 0 0;aspect-ratio:1/1;border-radius:52px;overflow:hidden;background:#7fd99a}
.q-art .scene{position:absolute;inset:0;width:100%;height:100%}
.q-art .em{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;line-height:1}
.q-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.q-foot{margin-top:auto;padding:30px 16px max(44px, calc(var(--safe-b) + 10px))}

/* run screens */
.run{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-t) + 70px) 24px calc(30px + var(--safe-b));color:#fff;text-align:center;background:var(--rb,var(--green))}
.run h1{margin-top:22px;font-size:32px;font-weight:800}
.run p{margin-top:8px;font-size:17px;opacity:.92}
.ringbox{position:relative;width:250px;height:250px;margin-top:10px}
.ringbox svg{width:250px;height:250px;transform:rotate(-90deg)}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .c .e{font-size:64px;line-height:1}
.ringbox .c b{margin-top:8px;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.run .earned{display:flex;align-items:center;gap:8px;margin-top:20px;padding:10px 18px;border-radius:20px;background:rgba(255,255,255,.2);font-size:20px;font-weight:700}
.run .earned .coin{width:24px;height:24px}
.run .spacer{flex:1;min-height:30px}
.run .btn-white{max-width:380px}
.run .lnk{margin-top:16px;font-size:16px;font-weight:600;opacity:.9;text-decoration:underline;text-underline-offset:3px}

.breath{position:relative;display:grid;place-items:center;width:260px;height:260px;margin-top:24px}
.breath .orb{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#d7f0fc 55%,#a5dcf6);box-shadow:0 0 0 18px rgba(255,255,255,.18),0 0 0 40px rgba(255,255,255,.1);transform:scale(.8);transition-property:transform;transition-timing-function:ease-in-out}
.breath .lbl{position:relative;font-size:22px;font-weight:700;color:#1f6a95}
.breath .lbl small{display:block;text-align:center;font-size:30px;font-weight:800;margin-top:2px}

.counter{display:flex;flex-direction:column;align-items:center;width:100%}
.pad-btn{display:grid;place-items:center;width:240px;height:240px;margin-top:20px;border-radius:50%;background:#fff;color:#e5484d;box-shadow:0 8px 0 rgba(0,0,0,.12);font-size:16px;font-weight:700}
.pad-btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pad-btn b{display:block;font-size:84px;line-height:1;font-weight:800;color:#222}
.pm{display:flex;gap:16px;margin-top:22px}
.pm button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:28px;font-weight:700;text-align:center}

.journal textarea{width:100%;min-height:180px;margin-top:16px;padding:16px;border:2px solid #ececec;border-radius:20px;font-size:18px;line-height:1.4;resize:vertical;background:#fcfcfc}
.journal textarea:focus{outline:none;border-color:#f2c987;background:#fff}
.prompt{padding:18px;border-radius:20px;background:#fff7e6;font-size:19px;font-weight:600;line-height:1.3}
.moods{display:flex;justify-content:space-between;gap:6px;margin-top:16px}
.moods button{flex:1;padding:10px 0;border-radius:16px;border:2px solid #eee;font-size:30px;text-align:center;line-height:1}
.moods button small{display:block;margin-top:6px;font-size:11.5px;color:#777}
.moods button.on{border-color:#f2a061;background:#fff3ea}

/* ---------------- panels (bottom pickers) ---------------- */
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
.backdrop.open{opacity:1}
.panel{
  position:fixed;left:0;right:0;bottom:0;z-index:81;
  width:min(100%,var(--col));margin:0 auto;max-height:86vh;overflow-y:auto;
  padding:10px 16px calc(24px + var(--safe-b));
  border-radius:28px 28px 0 0;background:#fff;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
.panel.open{transform:none}
.panel .grab{width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:#ddd}
.panel h3{font-size:22px;font-weight:800;letter-spacing:-.2px;text-align:center}
.panel .psub{margin:8px 0 0;text-align:center;font-size:15px;color:#8a8a8a;line-height:1.35}
.panel .body{margin-top:18px}
.panel .body p{font-size:16px;line-height:1.45;color:#444;margin-bottom:12px}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:10px;border:2px solid #eee;border-radius:18px;font-size:18px;font-weight:600}
.choice .r{margin-left:auto;display:flex;align-items:center;gap:6px;color:#7f7f7f;font-weight:500;font-size:16px}
.choice .r .coin{width:18px;height:18px}
.choice.on{border-color:var(--green);background:#f3fbec}
.choice:disabled{opacity:.45}
.choice .ai{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;font-size:15px;font-weight:800;flex:none}
.choice .box{margin-left:auto;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid #d4d4d4;color:#fff}
.choice.on .box{background:var(--green);border-color:var(--green)}
.choice .box svg{width:14px;height:14px}
.field{width:100%;height:56px;padding:0 16px;border:2px solid #ececec;border-radius:16px;font-size:19px;background:#fafafa}
.field:focus{outline:none;border-color:var(--green);background:#fff}
.field-time{font-size:28px;text-align:center;height:70px}
.panel .btn-green{margin-top:18px}
.panel .btn-ghost{margin-top:10px}
.p-mascot{width:112px;margin:4px auto 14px}
.p-mascot svg{width:100%;height:auto;overflow:visible}
.panel .choice .ic{font-size:24px;line-height:1}
.panel .choice small{display:block;margin-top:2px;font-size:14px;font-weight:500;color:#8a8a8a}
.panel .choice .chev{width:18px;height:18px;margin-left:auto;color:#9b9b9b;flex:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-grid .wd{font-size:13px;color:#9a9a9a;font-weight:600;padding-bottom:4px}
.cal-grid button{position:relative;aspect-ratio:1;border-radius:12px;font-size:15px;font-weight:600;background:#f6f6f6}
.cal-grid button.g{background:#e3f6d8;color:#2f7d17}
.cal-grid button.r{background:#fde3e1;color:#b8231c}
.cal-grid button.t{outline:2px solid #111;outline-offset:-2px}
.cal-grid button.sel{background:#111;color:#fff}
.cal-grid button:disabled{background:none;color:#ccc}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.cal-nav button{width:36px;height:36px;display:grid;place-items:center;color:#777}
.cal-nav button svg{width:22px;height:22px}
.cal-nav b{font-size:18px}
.day-list{margin-top:16px}
.day-list .tl{padding-top:10px;padding-bottom:10px}
.ch-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:16px 0 6px}
.ch-days i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:#f0f0f0;font-style:normal;font-size:13px;font-weight:700;color:#999}
.ch-days i.d{background:#5bb833;color:#fff}
.ch-days i.t{outline:2px solid #5bb833;outline-offset:1px}
.ch-days i.m{background:#fde3e1;color:#d0453f}

/* purchase animation */
.buy{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(14,22,18,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.buy.open{opacity:1}
.term{position:relative;width:180px;height:120px;border-radius:24px;background:#2b2f36;box-shadow:0 14px 30px rgba(0,0,0,.35);display:grid;place-items:center}
.term .scr{width:140px;height:64px;border-radius:12px;background:#11151b;color:#9fb3c8;display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:.3px;transition:background .25s,color .25s}
.term.ok .scr{background:#2fbf5b;color:#fff}
.term::after{content:"";position:absolute;top:-10px;left:50%;width:46px;height:14px;margin-left:-23px;border-radius:7px 7px 0 0;background:#3a3f48}
.mini-bank{position:relative;width:240px;aspect-ratio:343/240;border-radius:16px;overflow:hidden;color:#fff;margin-top:-10px;box-shadow:0 16px 36px rgba(0,0,0,.4);transform:translateY(120vh) rotate(-8deg);transition:transform .7s cubic-bezier(.2,.9,.25,1)}
.mini-bank .scene{position:absolute;inset:0;width:100%;height:100%}
.mini-bank .bn{position:absolute;left:10px;top:9px;font-size:14px;font-weight:700}
.mini-bank .chip{position:absolute;right:10px;top:10px;width:26px;height:21px}
.mini-bank .num{position:absolute;right:10px;bottom:9px;font-size:14px;font-weight:600}
.buy.s1 .mini-bank{transform:translateY(40px) rotate(-6deg)}
.buy.s2 .mini-bank{transform:translateY(-36px) rotate(0) scale(.94)}
.buy.s3 .mini-bank{transform:translateY(120vh) rotate(10deg)}
.receipt{
  position:absolute;left:50%;top:50%;width:min(300px,calc(100% - 48px));
  padding:22px 22px 26px;background:#fffdf7;color:#222;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.55;
  transform:translate(-50%,-30%) scaleY(.2);transform-origin:top;opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .3s;
  clip-path:polygon(0 0,100% 0,100% 100%,95% 98%,90% 100%,85% 98%,80% 100%,75% 98%,70% 100%,65% 98%,60% 100%,55% 98%,50% 100%,45% 98%,40% 100%,35% 98%,30% 100%,25% 98%,20% 100%,15% 98%,10% 100%,5% 98%,0 100%);
}
.buy.s4 .receipt{transform:translate(-50%,-50%) scaleY(1);opacity:1;visibility:visible;pointer-events:auto}
.buy.s4 .term,.buy.s4 .mini-bank{opacity:0;transition:opacity .2s}
.receipt h4{margin:0;text-align:center;font-size:15px;letter-spacing:2px}
.receipt .c{text-align:center;color:#777}
.receipt hr{border:0;border-top:1.5px dashed #bbb;margin:10px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:10px}
.receipt .tot{font-weight:800;font-size:15px}
.receipt .quote{margin-top:10px;text-align:center;font-style:italic;color:#555}
.receipt button{display:block;width:100%;margin-top:16px;height:46px;border-radius:12px;background:var(--green);color:#fff;font-family:var(--font);font-size:17px;font-weight:700;text-align:center;box-shadow:0 4px 0 var(--green-d)}

/* toast + coin burst */
.toast{
  position:fixed;left:50%;top:calc(var(--safe-t) + 16px);z-index:120;
  max-width:min(92vw,390px);padding:12px 18px;border-radius:18px;
  background:rgba(25,25,25,.92);color:#fff;font-size:16px;font-weight:600;text-align:center;
  transform:translate(-50%,calc(-100% - var(--safe-t) - 24px));visibility:hidden;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;
}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.burst{position:fixed;inset:0;z-index:110;pointer-events:none;overflow:hidden}
.burst .coin{position:absolute;left:50%;top:55%;width:34px;height:34px;animation:fly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.burst .plus{position:absolute;left:50%;top:44%;transform:translate(-50%,0);font-size:46px;font-weight:800;color:#f2b411;text-shadow:0 3px 0 #fff,0 0 18px rgba(255,255,255,.9);animation:rise 1.2s ease-out forwards}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  15%{opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:0}
}
@keyframes rise{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

// The pink brain mascot. Variants: wave, think, lift, journal, meditate, sit.
function brain(v = 'wave') {
  const P = '#f9c4ce', L = '#f6a9b7', F = '#ec8ea2', N = '#2c2c6c';
  const limb = (d, w = 13) => `<path d="${d}" fill="none" stroke="${L}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const hand = (x, y, r = 8.5) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${L}"/>`;
  const legs = limb('M90 148v40', 13) + limb('M112 148v40', 13) +
    `<rect x="76" y="183" width="22" height="13" rx="6.5" fill="${L}"/><rect x="104" y="183" width="22" height="13" rx="6.5" fill="${L}"/>`;
  let back = '', front = '';
  let brows = `<path d="M65 70c7-6 16-7 23-3M113 67c8-4 17-2 23 4" fill="none" stroke="${N}" stroke-width="4.6" stroke-linecap="round"/>`;
  let eyes = null, pupil = [0, 0];
  let mouth = `<path d="M91 113c6 7 14 7 20 0" fill="none" stroke="${N}" stroke-width="4.4" stroke-linecap="round"/>`;

  switch (v) {
    case 'think':
      back = legs + limb('M58 132c-12 12-14 24-10 34') + hand(48, 168);
      front = limb('M150 134c10 22-10 32-28 12') + hand(118, 140, 9.5);
      brows = `<path d="M63 64c8-9 19-10 27-5M113 72l24-5" fill="none" stroke="${N}" stroke-width="4.6" stroke-linecap="round"/>`;
      pupil = [3, -3];
      mouth = `<path d="M96 121c5-5 12-5 17-1" fill="none" stroke="${N}" stroke-width="4.4" stroke-linecap="round"/>`;
      break;
    case 'lift':
      back = legs + limb('M62 134c-6 14-6 28-2 42') + limb('M140 134c6 14 6 28 2 42');
      front = `<rect x="16" y="171" width="168" height="9" rx="4.5" fill="${N}"/><rect x="18" y="150" width="19" height="50" rx="9.5" fill="${N}"/><rect x="163" y="150" width="19" height="50" rx="9.5" fill="${N}"/>` + hand(60, 176, 9) + hand(142, 176, 9);
      brows = `<path d="M63 66l25 9M139 66l-25 9" fill="none" stroke="${N}" stroke-width="4.8" stroke-linecap="round"/>`;
      mouth = `<path d="M92 115c6 6 12 6 18 0" fill="none" stroke="${N}" stroke-width="4.4" stroke-linecap="round"/>`;
      break;
    case 'journal':
      back = legs + limb('M148 128c12 2 14 12 4 20');
      front = `<g transform="rotate(-13 80 152)"><rect x="52" y="120" width="56" height="68" rx="9" fill="#fde9a6"/><rect x="69" y="114" width="22" height="11" rx="3.5" fill="#f2896c"/></g>` +
        hand(58, 162, 9) + `<g transform="rotate(-38 152 138)"><rect x="132" y="133" width="44" height="10" rx="2.5" fill="#5b52e8"/><path d="M132 133l-9 5 9 5z" fill="#f4c9a0"/></g>` + hand(146, 140, 9);
      pupil = [-3, 3];
      break;
    case 'meditate':
      back = `<ellipse cx="82" cy="170" rx="28" ry="12" fill="${L}"/><ellipse cx="120" cy="170" rx="28" ry="12" fill="${L}"/>` +
        limb('M54 128c-10 12-18 22-30 26') + hand(20, 154, 8.5) + limb('M148 128c10 12 18 22 30 26') + hand(182, 154, 8.5);
      eyes = `<path d="M64 90c7 11 21 11 28 0M110 90c7 11 21 11 28 0" fill="none" stroke="${N}" stroke-width="5" stroke-linecap="round"/>`;
      brows = `<path d="M66 70c7-4 15-5 22-2M114 68c7-3 15-2 22 2" fill="none" stroke="${N}" stroke-width="4.2" stroke-linecap="round"/>`;
      break;
    case 'sit':
      back = limb('M80 156c-22 8-46 12-68 12', 15) + `<ellipse cx="8" cy="166" rx="10" ry="13" fill="${L}"/>` +
        limb('M44 136c-16-4-30-16-38-34') + hand(2, 100, 11) +
        `<circle cx="-7" cy="90" r="5" fill="${L}"/><circle cx="2" cy="86" r="5" fill="${L}"/><circle cx="11" cy="90" r="5" fill="${L}"/>` +
        limb('M148 146c8 12 12 24 12 36', 14) + hand(160, 184, 10);
      front = limb('M104 152c6 14 4 26-6 38', 16) + `<ellipse cx="96" cy="194" rx="12" ry="8" fill="${L}"/>`;
      break;
    default: // wave
      back = legs + limb('M56 132c-10 10-14 22-12 32') + hand(44, 166) + limb('M146 146c22 6 40 6 48-22') + hand(196, 116, 10) +
        `<circle cx="189" cy="104" r="4.6" fill="${L}"/><circle cx="197" cy="101" r="4.6" fill="${L}"/><circle cx="205" cy="105" r="4.6" fill="${L}"/>`;
  }
  if (!eyes) {
    const [px, py] = pupil;
    eyes = `<ellipse cx="78" cy="92" rx="17" ry="18.5" fill="#fff"/><ellipse cx="124" cy="92" rx="17" ry="18.5" fill="#fff"/>` +
      `<circle cx="${80 + px}" cy="${95 + py}" r="12.5" fill="${N}"/><circle cx="${126 + px}" cy="${95 + py}" r="12.5" fill="${N}"/>` +
      `<circle cx="${84 + px}" cy="${89 + py}" r="4.3" fill="#fff"/><circle cx="${130 + px}" cy="${89 + py}" r="4.3" fill="#fff"/>`;
  }
  const head = `<g fill="${P}"><circle cx="56" cy="64" r="28"/><circle cx="88" cy="44" r="30"/><circle cx="122" cy="44" r="30"/><circle cx="150" cy="64" r="28"/><circle cx="166" cy="96" r="24"/><circle cx="152" cy="124" r="26"/><circle cx="122" cy="138" r="24"/><circle cx="86" cy="140" r="24"/><circle cx="54" cy="126" r="26"/><circle cx="36" cy="96" r="24"/><ellipse cx="101" cy="94" rx="62" ry="52"/></g>`;
  const folds = `<g fill="none" stroke="${F}" stroke-width="3.2" stroke-linecap="round"><path d="M104 16c-5 9 4 17-1 28"/><path d="M58 46c9-6 19-5 25 2"/><path d="M128 30c9-1 16 3 19 10"/><path d="M24 96c-1 8 2 15 8 19"/><path d="M178 92c2 9-1 16-7 21"/><path d="M70 152c7 3 14 2 19-3"/><path d="M128 156c6-1 11-5 13-10"/></g>`;
  const cheeks = `<g fill="${F}"><circle cx="55" cy="111" r="2.5"/><circle cx="61" cy="117" r="2.5"/><circle cx="51" cy="118" r="2.3"/><circle cx="147" cy="111" r="2.5"/><circle cx="142" cy="117" r="2.5"/><circle cx="151" cy="118" r="2.3"/></g>`;
  return `<svg viewBox="0 0 200 205" overflow="visible" aria-hidden="true" focusable="false">${back}${head}${folds}${cheeks}${eyes}${brows}${mouth}${front}</svg>`;
}

let aggCache = null, aggVer = -1;
function A() {
  if (aggVer === ver && aggCache) return aggCache;
  const coins = {}, rot = {}, unrot = {}, coinHour = Array(24).fill(0), rotHour = Array(24).fill(0);
  for (const e of S.log) {
    const k = dkey(e.ts), h = new Date(e.ts).getHours();
    if (e.coins > 0) { coins[k] = (coins[k] || 0) + e.coins; coinHour[h] += e.coins; }
    if (e.type === 'rot') { rot[k] = (rot[k] || 0) + e.mins; rotHour[h] += e.mins; }
    if (e.cat === 'timed') unrot[k] = (unrot[k] || 0) + e.mins;
  }
  aggCache = { coins, rot, unrot, coinHour, rotHour };
  aggVer = ver;
  return aggCache;
}

function streakInfo() {
  const { coins } = A();
  const today = startOfDay(Date.now());
  const ok = d => (coins[dkey(d)] || 0) >= STREAK_GOAL;
  let cur = 0;
  for (let d = ok(today) ? today : addDays(today, -1); ok(d); d = addDays(d, -1)) cur++;
  let best = 0, run = 0, prev = null;
  for (const k of Object.keys(coins).filter(k => coins[k] >= STREAK_GOAL).sort()) {
    const d = keyDate(k);
    run = prev && dayDiff(prev, d) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = d;
  }
  return { cur, best: Math.max(best, cur), today: coins[dkey(today)] || 0, secured: ok(today) };
}

/* ================================================================
   sheets & panels (a single stack)
   ================================================================ */
const stack = [];
const topSheet = () => stack[stack.length - 1];
const buyOpen = () => document.querySelector('.buy:not([data-done])');

// Only the top layer (or the purchase overlay) is interactive; everything under it is inert.
function syncLayers() {
  const buy = buyOpen();
  const top = buy ? null : topSheet();
  $('#app').inert = $('.tabbar').inert = !!(buy || stack.length);
  for (const s of stack) {
    const off = s !== top;
    s.el.inert = off;
    if (s.bd) s.bd.inert = off;
  }
}
// Re-render `root` without losing keyboard focus on the button that had it.
function keepFocus(root, fn) {
  const a = document.activeElement;
  const sel = a && root.contains(a) && a.dataset && a.dataset.act
    ? `[data-act="${CSS.escape(a.dataset.act)}"]` + (a.dataset.id ? `[data-id="${CSS.escape(a.dataset.id)}"]` : '')
    : null;
  fn();
  if (sel) { const n = root.querySelector(sel); if (n) n.focus({ preventScroll: true }); }
}

function pushLayer(s) {
  const z = 60 + stack.length * 2;
  if (s.bd) { s.bd.style.zIndex = z; document.body.appendChild(s.bd); }
  s.el.style.zIndex = z + 1;
  s.el.tabIndex = -1;
  const r = document.activeElement;
  s.ret = r;
  s.retSel = r && r.dataset && r.dataset.act ? `[data-act="${CSS.escape(r.dataset.act)}"]` + (r.dataset.id ? `[data-id="${CSS.escape(r.dataset.id)}"]` : '') : null;
  document.body.appendChild(s.el);
  stack.push(s);
  drawSheet(s);
  syncLayers();
  document.body.classList.add('locked');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    s.el.classList.add('open');
    if (s.bd) s.bd.classList.add('open');
  }));
  if (s.mount) s.mount(s);
  const f = s.el.querySelector('[autofocus]') || s.el;
  setTimeout(() => { if (!s.closed && topSheet() === s) f.focus({ preventScroll: true }); }, f === s.el ? 30 : 350);
  return s;
}
function openSheet(opts) {
  const el = document.createElement('div');
  el.className = 'sheet ' + (opts.cls || '');
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  return pushLayer({ ...opts, el });
}
function openPanel(opts) {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.dataset.act = 'close';
  const el = document.createElement('div');
  el.className = 'panel';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  return pushLayer({ ...opts, el, bd });
}
function drawSheet(s) {
  if (!s.render) return;
  keepFocus(s.el, () => {
    const st = s.el.scrollTop;
    s.el.innerHTML = s.render(s);
    s.el.scrollTop = st;
    if (s.after) s.after(s);
  });
}
function closeSheet(s = topSheet()) {
  const i = stack.indexOf(s);
  if (!s || i < 0) return;
  stack.splice(i, 1);
  s.closed = true;
  syncLayers();
  if (s.onClose) s.onClose(s);
  s.el.classList.remove('open');
  if (s.bd) s.bd.classList.remove('open');
  setTimeout(() => { s.el.remove(); if (s.bd) s.bd.remove(); }, 400);
  if (!stack.length) document.body.classList.remove('locked');
  const t = topSheet();
  let back = s.ret && s.ret.isConnected && !s.ret.closest('[inert]') ? s.ret : null;
  if (!back && s.retSel) { const n = (t ? t.el : $('#tab-' + UI.tab)).querySelector(s.retSel); if (n && !n.closest('[inert]')) back = n; }
  if (!back && t) back = t.el;
  if (back) back.focus({ preventScroll: true });
}
const sheetOf = el => stack.find(s => s.el.contains(el));

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');

}

function burst(n) {
  if (!(n > 0) || reduceMotion()) return;
  const b = document.createElement('div');
  b.className = 'burst';
  const count = Math.min(10, 3 + n);
  let html = `<div class="plus">+${n}</div>`;
  for (let i = 0; i < count; i++) {
    const ang = (-90 + (i - (count - 1) / 2) * 20) * Math.PI / 180;
    const r = 150 + Math.random() * 70;
    html += coin(34, `style="--dx:${(Math.cos(ang) * r).toFixed(0)}px;--dy:${(Math.sin(ang) * r).toFixed(0)}px;--rot:${Math.round(Math.random() * 140 - 70)}deg;animation-delay:${i * 35}ms"`);
  }
  b.innerHTML = html;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1600);
}

  rot:   { title: 'Brainrot Time', map: ag => ag.rot, fmt: fmtMins, color: '#ff3b30', pale: '#fde0de', upGood: false, minBar: 28, icon: () => ICON.skull, badge: (up, p) => `${up ? 'More' : 'Less'} than last ${p}` },
  unrot: { title: 'Unrot Time', map: ag => ag.unrot, fmt: fmtMins, color: '#5cb83a', pale: '#e2f3da', upGood: true, minBar: 28, icon: () => ICON.hourglass, badge: (up, p) => `vs last ${p}` },
};

function period(mode, off) {
  const now = new Date();
  if (mode === 'week') {
    const s = startOfDay(now);
    s.setDate(s.getDate() - s.getDay() + off * 7);
    const days = Array.from({ length: 7 }, (_, i) => addDays(s, i));
    return { days, label: rangeLabel(days[0], days[6]), labels: days.map(d => WD[d.getDay()]) };
  }
  const s = new Date(now.getFullYear(), now.getMonth() + off, 1);
  const n = new Date(s.getFullYear(), s.getMonth() + 1, 0).getDate();
  const days = Array.from({ length: n }, (_, i) => new Date(s.getFullYear(), s.getMonth(), i + 1));
  return { days, label: `thg ${s.getMonth() + 1} ${s.getFullYear()}`, labels: days.map(d => [1, 8, 15, 22, 29].includes(d.getDate()) ? String(d.getDate()) : '') };
}

function chartCard(id) {
  const cfg = CHARTS[id], ui = UI.charts[id], map = cfg.map(A());
  const p = period(ui.mode, ui.off), pp = period(ui.mode, ui.off - 1);
  const val = d => map[dkey(d)] || 0;
  const vals = p.days.map(val);
  const total = sum(vals), prev = sum(pp.days.map(val));
  const span = ui.mode === 'week' ? 'week' : 'month';
  let badge = '';
  if ((total || prev) && total !== prev) {
    const up = total > prev;
    const pct = prev ? Math.round((total - prev) / prev * 100) : 100;
    badge = `<div class="badge" style="--bc:${up === cfg.upGood ? '#3cc05a' : '#ff3b30'}"><span class="ar">${up ? ICON.arrowNE : ICON.arrowSE}</span>
      <span><b>${pct > 0 ? '+' : ''}${pct}%</b><small>${cfg.badge(up, span)}</small></span></div>`;
  }
  const max = Math.max(0, ...vals), nice = niceMax(max), H = 140;
  const ticks = max >= nice * .2 ? [0, nice / 2, nice] : [0];
  const week = ui.mode === 'week';
  const cols = vals.map((v, i) => `<div class="colw">${v > 0
    ? `<div class="b" style="height:${Math.max(cfg.minBar, v / nice * H).toFixed(1)}px" title="${p.days[i].getDate()}/${p.days[i].getMonth() + 1}: ${cfg.fmt(v)}"></div>`
    : '<div class="b z"></div>'}<span class="lb">${p.labels[i]}</span></div>`).join('');
  return `<div class="chart">
    <div class="hd"><span class="ttl">${cfg.title}</span>${badge}</div>
    <div class="vrow"><span class="val"><span class="vi">${cfg.icon()}</span>${cfg.fmt(total)}</span>
      <span class="seg" role="tablist"><button class="${week ? 'on' : ''}" data-act="chartMode" data-id="${id}:week" role="tab" aria-selected="${week}">Week</button><button class="${week ? '' : 'on'}" data-act="chartMode" data-id="${id}:month" role="tab" aria-selected="${!week}">Month</button></span></div>
    <div class="nav"><button data-act="chartNav" data-id="${id}:-1" aria-label="Previous ${span}">${ICON.chevL}</button><span>${p.label}</span>
      <button data-act="chartNav" data-id="${id}:1" aria-label="Next ${span}" ${ui.off >= 0 ? 'disabled' : ''}>${ICON.chevR}</button></div>
    <div class="plot" style="--c:${cfg.color};--p:${cfg.pale}">
      <div class="cols" style="--n:${vals.length};--gap:${week ? 8 : 3}px;--br:${week ? 6 : 3}px">
        ${ticks.map(t => `<div class="grid" style="bottom:${16 + t / nice * H}px"></div>`).join('')}${cols}</div>
      <div class="axis">${ticks.map(t => `<span style="bottom:${16 + t / nice * H}px">${id === 'coins' ? t : (t ? fmtMins(t) : 0)}</span>`).join('')}</div>
    </div></div>`;
}

function patternsHtml() {
  const ag = A();
  const st = streakInfo();
  const dayKeys = Object.keys(ag.coins);
  const best = dayKeys.reduce((b, k) => (!b || ag.coins[k] > ag.coins[b] ? k : b), null);
  const avg = dayKeys.length ? sum(dayKeys.map(k => ag.coins[k])) / dayKeys.length : 0;
  const bestX = best && avg ? (ag.coins[best] / avg).toFixed(1) : '1.0';
  const record = best ? ag.coins[best] : 0;
  const longest = Math.max(0, ...S.log.filter(e => e.cat === 'timed').map(e => e.mins));
  const peak = arr => { const m = Math.max(...arr); return m > 0 ? arr.indexOf(m) : -1; };
  const ch = peak(ag.coinHour), rh = peak(ag.rotHour);
  const rotKeys = Object.keys(ag.rot);
  const worst = rotKeys.reduce((b, k) => (!b || ag.rot[k] > ag.rot[b] ? k : b), null);
  const worstMins = worst ? ag.rot[worst] : 0;
  const tall = (bg, em, value, label, small) => `<div class="pc tall" style="--pc:${bg}"><span class="em">${em}</span><span><b>${value}</b><span class="lab">${label}</span>${small ? `<small>${small}</small>` : ''}</span></div>`;
  const short = (bg, em, value, label) => `<div class="pc short" style="--pc:${bg}"><span class="em">${em}</span><span class="tx"><b>${value}</b><span class="lab">${label}</span></span></div>`;
  return `<div class="patterns">
    <div class="pcol">${tall('#d6fbfc', '✅', viLong(S.member), 'Member Since')}${short('#effaee', '💪', fmtMins(longest), 'Longest Unrot')}</div>
    <div class="pcol">${short('#effaee', '🔥', `${st.best} day${st.best === 1 ? '' : 's'}`, 'Best streak')}${tall('#f4e7fd', '🏆', `<span class="vrow">${record} ${coin(24)}</span>`, 'Personal record', 'coins in a day')}</div>
    <div class="pcol">${tall('#e6f59b', coin(34), best ? viLong(keyDate(best)) : 'N/A', 'Best day', `${bestX}x average`)}${short('#fdefe4', '🌅', ch < 0 ? 'N/A' : viHour(ch), 'Coins<br>peak hour')}</div>
    <div class="pcol">${short('#fde9e9', '🌅', rh < 0 ? 'N/A' : viHour(rh), 'Brainrot<br>peak hour')}${tall('#d6fbfc', ICON.skull, worstMins >= 60 ? viLong(keyDate(worst)) : 'N/A', 'Worst Day', `${Math.floor(worstMins / 60)} hours brainrot`)}</div>
  </div>`;
}

function insteadRows() {
  const groups = {};
  for (const e of S.log) {
    if (e.type !== 'unrot') continue;
    let key;
    if (UI.instead === 'power' && CATS[e.cat]) key = e.cat;
    else if (UI.instead === 'unrots' && e.cat === 'timed') key = e.act;
    else continue;
    const g = groups[key] || (groups[key] = { n: 0, mins: 0, coins: 0 });
    g.n++; g.mins += e.mins; g.coins += e.coins;
  }
  const rows = Object.entries(groups).sort((a, b) => b[1].coins - a[1].coins);
  if (!rows.length) return `<div class="empty">${UI.instead === 'power' ? 'No power ups yet. Try a breathing exercise!' : 'No Unrots yet. Start one from the home screen!'}</div>`;
  return rows.map(([k, g]) => {
    const isCat = UI.instead === 'power';
    const title = isCat ? CATS[k].stat : ACTS[k] ? ACTS[k].title : k;
    const icon = isCat ? CATS[k].icon : ACTS[k] ? ACTS[k].icon : '✨';
    const tone = TONES[isCat ? CATS[k].tone : 'orange'];
    return `<div class="pu"><span class="ico" style="--t-bg:${tone[0]}">${icon}</span>
      <span class="tx"><b>${title}</b><span>${g.n} times${g.mins ? ` · ${fmtMins(g.mins)}` : ''}</span></span>
      <span class="amt">${coin(22)}${g.coins}</span></div>`;
  }).join('');
}

function challengeState() {
  const ch = S.challenge;
  if (!ch) return null;
  const ag = A();
  const dayIdx = Math.min(27, Math.max(0, dayDiff(ch.start, Date.now())));
  const days = Array.from({ length: 28 }, (_, i) => {
    const d = addDays(startOfDay(ch.start), i);
    return { d, done: (ag.coins[dkey(d)] || 0) >= STREAK_GOAL, past: i < dayIdx, today: i === dayIdx };
  });
  const finished = dayDiff(ch.start, Date.now()) >= 28;
  return { dayIdx, days, done: days.filter(x => x.done).length, finished };
}

function renderChallenges() {
  const cs = challengeState();
  const label = !cs ? 'NOT STARTED' : cs.finished ? 'COMPLETED' : 'IN PROGRESS';
  $('#tab-challenges').innerHTML = `

}

const RENDER = { home: renderHome, stats: renderStats, challenges: renderChallenges, settings: renderSettings };

function showTab(t) {
  UI.tab = t;
  $$('.tab').forEach(s => s.classList.toggle('on', s.dataset.tab === t));
  $$('.tabbar button').forEach(b => {
    const on = b.dataset.id === t;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  RENDER[t]();
  window.scrollTo(0, 0);
}
function refresh() {
  keepFocus($('#tab-' + UI.tab), RENDER[UI.tab]);
  for (const s of stack) if (s.live !== false && !s.closed) drawSheet(s);
}
function onScroll() {
  const bar = $('#set-bar');
  if (bar) bar.classList.toggle('show', UI.tab === 'settings' && window.scrollY > 44);
}

const RING_C = 2 * Math.PI * 110;
function runSheet() {
  const act = S.active;
  if (!act) return;
  const a = ACTS[act.id];
  openSheet({
    live: false, noEsc: true, cls: 'run-sheet', key: act.start,
    render: () => `
      <div class="run">
        <div class="ringbox"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="110" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="14"/>
          <circle class="rp" cx="125" cy="125" r="110" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="0"/></svg>
          <div class="c"><span class="e">${a.hero || a.icon}</span><b class="clock">${fmtClock(act.dur * 60)}</b></div></div>
        <h1>${a.title}</h1><p>Put your phone down. Your brain is healing.</p>
        <div class="earned">${coin(24)} <span class="ec">+0</span></div>
        <div class="spacer"></div>
        <button class="btn-white" data-act="endUnrot">End session</button>
        <button class="lnk" data-act="shareOffline" data-id="${act.id}">Tell people you're offline</button>
      </div>`,
    mount: s => s.tick(s),
    tick: s => {
      const cur = S.active;
      if (!cur) return;
      const el = (Date.now() - cur.start) / 1000, total = cur.dur * 60;
      if (el >= total) { finishUnrot(true); return; }
      s.el.querySelector('.clock').textContent = fmtClock(total - el);
      s.el.querySelector('.rp').style.strokeDashoffset = (RING_C * el / total).toFixed(1);
      s.el.querySelector('.ec').textContent = `+${Math.floor(Math.floor(el / 60) * a.rate / 60)}`;
    },
  });
}
function finishUnrot(full) {
  const act = S.active;
  if (!act) return;
  const a = ACTS[act.id];
  const mins = full ? act.dur : Math.floor((Date.now() - act.start) / MIN);
  S.active = null;
  if (blocking()) Native.call('endSession');
  const run = stack.find(s => s.cls === 'run-sheet');
  if (run) { stack.slice(stack.indexOf(run) + 1).forEach(x => closeSheet(x)); closeSheet(run); }
  confirmCb = null;
  if (mins < 1) { save(); refresh(); toast('Session ended. Stay at least a minute to log it.'); return; }
  const coins = Math.floor(mins * a.rate / 60);
  award({ act: a.id, mins, coins, ts: act.start });
  resultPanel(full ? '🎉' : '🌱', full ? 'Unrot complete!' : 'Nice effort!',
    `You spent ${fmtDurLong(mins)} on ${a.title.toLowerCase()} and earned ${coins} Brain Coin${coins === 1 ? '' : 's'}.`);
}

function breathSheet(id) {
  const a = ACTS[id];
  const runPhase = s => {
    if (s.closed) return;
    s.phase = (s.phase + 1) % a.steps.length;
    const [label, secs, big] = a.steps[s.phase];
    const orb = s.el.querySelector('.orb');

// Bring the native shields in line with the web state: the app may have been closed while scroll time or a
// session ran out, a request may have failed, or one may have been skipped because the status wasn't known yet.
function reconcile() {
  if (!blocking()) return Promise.resolve();
  const st = Native.status, now = Date.now(), jobs = [];
  const unlockLeft = S.unlock ? S.unlock.start + S.unlock.dur * MIN - now : 0;
  const sessionLeft = S.active ? S.active.start + S.active.dur * MIN - now : 0;
  const unlocked = st.unlockedUntil && st.unlockedUntil > now, inSession = st.sessionUntil && st.sessionUntil > now;
  if (unlockLeft <= 0 && unlocked) jobs.push(Native.call('relock'));
  else if (unlockLeft >= MIN && !unlocked) jobs.push(Native.call('unlock', { minutes: Math.floor(unlockLeft / MIN) }));
  if (sessionLeft <= 0 && inSession) jobs.push(Native.call('endSession'));
  else if (sessionLeft > 0 && !inSession) jobs.push(Native.call('startSession', { minutes: Math.ceil(sessionLeft / MIN), title: ACTS[S.active.id].title }));
  return Promise.all(jobs);
}
// Fetch the status and reconcile, unless a shield request went out meanwhile (the reply would be stale).
function syncNative() {
  const sent = Native.sent;
  return Native.refreshStatus().then(() => (Native.sent === sent ? reconcile() : null));
}

// One native request at a time for the ones that show system UI, then redraw with the new status.
async function nativeTask(fn) {
  if (Native.busy) return;
  Native.busy = true;
  try { await fn(); } finally { Native.busy = false; refresh(); }
}

    else if (!stack.some(s => s.kind === 'blocking' && !s.closed)) setTimeout(blockingPanel, 450);
  });
}
