# Builds the downloadable apps and publishes them as the GitHub release "unrot-latest":
#   unrot-mac.zip            the Mac app (universal arm64 + x86_64, ad hoc signed, not notarized)
#   unrot-iphone-xcode.zip   the iPhone Xcode projects, already generated by XcodeGen, ready to
#                            open in Xcode and run on your own iPhone (see START-HERE.txt inside)
# Release page: https://github.com/<owner>/<repo>/releases/tag/unrot-latest
name: Apps

on:
  push:
    paths:
      - "ios/**"
      - "mac/**"
      - "unrot/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: any failing command (also inside a pipe) fails the step.
    shell: bash

jobs:
  mac-app:
    name: Mac app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate UnrotMac.xcodeproj
        working-directory: mac
        run: xcodegen generate

      - name: Build Unrot.app (Release, universal, ad hoc signed)
        working-directory: mac
        run: |
          set -o pipefail
          xcodebuild \
            -project UnrotMac.xcodeproj \
            -scheme Unrot \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee build-mac.log

      - name: Check the app bundle
        working-directory: mac
        run: |
          APP=build/Build/Products/Release/Unrot.app
          if [ ! -d "$APP" ]; then
            echo "::error::$APP was not built"
            exit 1
          fi
          codesign --verify --deep --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)' || true
          lipo -info "$APP/Contents/MacOS/Unrot"
          test -f "$APP/Contents/Resources/web/unrot/index.html"
          plutil -p "$APP/Contents/Info.plist"

      - name: Smoke test (launch, screenshot, quit)
        working-directory: mac
        # screencapture or osascript could wait on a permission prompt nobody answers.
        timeout-minutes: 3
        run: |
          APP="$PWD/build/Build/Products/Release/Unrot.app"
          REPORTS="$HOME/Library/Logs/DiagnosticReports"
          crash_reports() { find "$REPORTS" -maxdepth 1 -iname 'Unrot*' 2>/dev/null | sort || true; }
          show_crash_reports() {
            for f in "$REPORTS"/Unrot*; do
              [ -f "$f" ] && { echo "== $f"; head -n 120 "$f"; }
            done
            return 0
          }

          BEFORE="$(crash_reports)"
          open -n "$APP"
          sleep 12

          if ! pgrep -x Unrot >/dev/null; then
            echo "::error::Unrot is not running 12 seconds after launch"
            show_crash_reports
            exit 1
          fi
          if [ "$(crash_reports)" != "$BEFORE" ]; then
            echo "::error::Unrot wrote a crash report"
            show_crash_reports
            exit 1
          fi
          echo "Unrot is running (pid $(pgrep -x Unrot | tr '\n' ' '))"

          # Screenshot of the whole screen (non-fatal: it needs screen recording access).
          if screencapture -x shot.png && [ -s shot.png ] \
            && sips -Z 900 -s format jpeg -s formatOptions 55 shot.png --out shot.jpg >/dev/null; then
            echo "----BEGIN UNROT MAC SCREENSHOT----"
            # /usr/bin/base64 is the BSD one (-i file, -b 0 = one line); a Homebrew one could shadow it.
            printf '%s\n' "$(/usr/bin/base64 -i shot.jpg -b 0)"
            echo "----END UNROT MAC SCREENSHOT----"
          else
            echo "::warning::Could not take a screenshot"
          fi

          # Quit. osascript could wait on an Automation prompt, so give it 10 seconds, then pkill.
          osascript -e 'quit app "Unrot"' >/dev/null 2>&1 &
          OSA=$!
          for _ in $(seq 1 10); do
            pgrep -x Unrot >/dev/null || break
            sleep 1
          done
          kill "$OSA" 2>/dev/null || true
          pkill -x Unrot || true

      - name: Zip Unrot.app
        working-directory: mac/build/Build/Products/Release
        run: ditto -c -k --sequesterRsrc --keepParent Unrot.app "$GITHUB_WORKSPACE/unrot-mac.zip"

      - name: Upload unrot-mac
        uses: actions/upload-artifact@v4
        with:
          name: unrot-mac
          path: unrot-mac.zip
          if-no-files-found: error

      - name: Upload build log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: |
            mac/build-mac.log
            mac/shot.jpg
          if-no-files-found: ignore

  iphone-project:
    name: iPhone Xcode project
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Unrot.xcodeproj and UnrotScreenTime.xcodeproj
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          xcodegen generate --spec project.screentime.yml

      # ios/ and unrot/ side by side, exactly like in the repository, so ../unrot still resolves.
      - name: Assemble unrot-iphone-xcode
        run: |
          OUT=unrot-iphone-xcode
          rm -rf "$OUT"
          mkdir -p "$OUT"
          rsync -a \
            --exclude 'build/' --exclude 'DerivedData/' --exclude 'xcuserdata/' \
            --exclude 'build-*.log' --exclude '.DS_Store' \
            ios/ "$OUT/ios/"
          rsync -a --exclude '.DS_Store' unrot/ "$OUT/unrot/"
          cat > "$OUT/START-HERE.txt" <<'EOF'
          unrot for iPhone - how to put it on your phone
          ================================================

          You need: a Mac with Xcode (free from the Mac App Store), your iPhone and a USB cable,
          and an Apple ID (a free one is fine).

          1. Unzip unrot-iphone-xcode.zip (double-click it). Keep the "ios" and "unrot" folders
             next to each other.
          2. Open the "ios" folder and double-click Unrot.xcodeproj. Xcode opens.
          3. Xcode > Settings > Accounts > "+" > Apple ID, and sign in.
          4. In Xcode's left sidebar click the blue "Unrot" project icon, select the "Unrot"
             target, then the "Signing & Capabilities" tab. Under "Team" pick your name
             ("Your Name (Personal Team)").
          5. If Xcode says the Bundle Identifier is not available (someone already took it),
             change "com.yourname" in the Bundle Identifier field to something of your own,
             for example com.janedoe.unrot. (Or edit BUNDLE_PREFIX in ios/Config.xcconfig.)
          6. Plug in the iPhone, unlock it and tap "Trust".
          7. On the iPhone turn on Developer Mode: Settings > Privacy & Security >
             Developer Mode > On, then restart the iPhone when it asks. (The switch only shows
             up after the iPhone was connected to Xcode once.)
          8. In Xcode, pick your iPhone at the top of the window (the run destination).
          9. Press the Run button (the triangle, or Cmd+R). The first build takes a minute.
          10. On the iPhone, if it says "Untrusted Developer": Settings > General >
              VPN & Device Management > your Apple ID > Trust. Then press Run again.

          Good to know
          - Apps built with a free Apple ID stop opening after 7 days. Plug the iPhone in and
            press Run again to renew it; your Brain Coins and history stay.
          - This free version cannot block other apps (scroll time works on the honour system).
            Real app blocking is ios/UnrotScreenTime.xcodeproj, which needs the paid Apple
            Developer Program. Instructions: ios/README.md, part 2.
          EOF
          find "$OUT" -maxdepth 2 | sort

      - name: Zip unrot-iphone-xcode
        run: ditto -c -k --sequesterRsrc --keepParent unrot-iphone-xcode unrot-iphone-xcode.zip

      # Unzip a fresh copy and build its free project for the Simulator (unsigned, same flags
      # as ios.yml) to prove the zip works on its own.
      - name: Build the zipped project (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          CHECK="$RUNNER_TEMP/zip-check"
          rm -rf "$CHECK"
          mkdir -p "$CHECK"
          ditto -x -k unrot-iphone-xcode.zip "$CHECK"
          cd "$CHECK/unrot-iphone-xcode/ios"
          xcodebuild \
            -project Unrot.xcodeproj \
            -scheme Unrot \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/zip-check-build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build-iphone.log"

      - name: Upload unrot-iphone-xcode
        uses: actions/upload-artifact@v4
        with:
          name: unrot-iphone-xcode
          path: unrot-iphone-xcode.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build-log
          path: build-iphone.log
          if-no-files-found: ignore

  release:
    name: Publish release unrot-latest
    needs: [mac-app, iphone-project]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Two pushes in a row must not delete each other's fresh release half way.
    concurrency:
      group: unrot-latest-release
      cancel-in-progress: false
    steps:
      # Each artifact holds one .zip file (the ditto zip itself); merge them into dist/.
      - name: Download the zips
        uses: actions/download-artifact@v4
        with:
          pattern: unrot-*
          path: dist
          merge-multiple: true

      - name: Check the zips
        run: |
          ls -la dist
          test -f dist/unrot-mac.zip
          test -f dist/unrot-iphone-xcode.zip

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Latest build of unrot, made automatically from the newest code.

          **Mac: `unrot-mac.zip`**
          Unzip it and drag **Unrot** into your **Applications** folder. The first time, open it
          with right-click > **Open** (macOS 14), or try to open it once and then go to
          **System Settings > Privacy & Security > Open Anyway** (macOS 15 and later). The app is
          not notarized because that needs a paid Apple account. More in `mac/README.md`.

          **iPhone: `unrot-iphone-xcode.zip`**
          Unzip it and follow **START-HERE.txt**. You need a Mac with Xcode and a free Apple ID.
          EOF
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete unrot-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create unrot-latest dist/unrot-mac.zip dist/unrot-iphone-xcode.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "unrot (latest build)" \
            --notes-file notes.md
