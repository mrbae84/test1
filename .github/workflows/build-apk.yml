# Tự build file cài APK trên GitHub và đăng lên mục Releases để tải thẳng về điện thoại.
name: Build APK

on:
  push:
    branches: [trinhdoc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MeraOffice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeraOffice-apk
          path: MeraOffice.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete trinhdoc-apk --yes --cleanup-tag || true
          gh release create trinhdoc-apk MeraOffice.apk \
            --target "$GITHUB_SHA" \
            --title "Mera Office – bản mới nhất" \
            --notes "Tải file MeraOffice.apk về điện thoại và bấm để cài."
