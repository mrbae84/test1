# project.yml - the Mac app  ->  UnrotMac.xcodeproj
#
#   cd mac && xcodegen generate            (project.yml is XcodeGen's default spec)
#
# A native macOS shell around the same web app as the iPhone version (../unrot), shown in a
# WKWebView. Apple's Screen Time shielding APIs do not exist on macOS, so unrot blocks apps the
# way desktop focus apps do: it watches which app comes to the front (NSWorkspace) and hides
# distracting apps that have no bought scroll time. That needs no special entitlement, so the app
# is NOT sandboxed and is signed ad hoc ("Sign to Run Locally"): it builds and runs without any
# Apple account.
#
# Shares BundleSchemeHandler (the app:// file server) with the iPhone app via ../ios/WebShared.
# Spec reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: UnrotMac

options:
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Config.xcconfig holds BUNDLE_PREFIX (and an empty DEVELOPMENT_TEAM).
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    # Swift 5 language mode (SWIFT_VERSION only accepts language modes: 4, 4.2, 5, 6).
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

fileGroups:
  - README.md

targets:
  Unrot:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App                  # Swift sources + Assets.xcassets (AppIcon, AccentColor)
      - path: ../ios/WebShared     # BundleSchemeHandler, shared with the iPhone app
      # The whole web app, copied as a folder reference so the bundle keeps the folder:
      # Unrot.app/Contents/Resources/web/unrot/index.html, .../web/unrot/fonts/..., ...
      # Same layout as the iPhone app (see ../ios/project.common.yml), so BundleSchemeHandler
      # finds it with the same lookup.
      - path: ../unrot
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: web
    settings:
      base:
        PRODUCT_NAME: Unrot
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).unrot.mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # Blocking other apps (NSRunningApplication.hide) only works outside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        # Hardened Runtime only matters for notarization, which needs a paid Apple account.
        ENABLE_HARDENED_RUNTIME: NO
        # Ad hoc signing: "-" means "Sign to Run Locally". No Apple ID, team or certificate needed.
        # Apple Silicon Macs refuse to run unsigned code, and an ad hoc signature is enough.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        ENABLE_PREVIEWS: NO
        # The App Store category. What macOS reads is the Info.plist key of the same name below;
        # this build setting just keeps the value visible in Xcode's build settings.
        LSApplicationCategoryType: public.app-category.productivity
    # Generated by XcodeGen on every `xcodegen generate` (CFBundleIdentifier, CFBundleExecutable,
    # CFBundlePackageType, ... are added automatically).
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: unrot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "unrot - earn your scroll time. Free and open source."
    # Creates a shared scheme called "Unrot" (used by CI: xcodebuild -scheme Unrot).
    scheme: {}
