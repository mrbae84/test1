# project.screentime.yml - SCREEN TIME build  ->  UnrotScreenTime.xcodeproj
#
#   cd ios && xcodegen generate --spec project.screentime.yml
#
# Real app blocking with Apple's Screen Time API. Needs a PAID Apple Developer Program team:
# the Family Controls capability (com.apple.developer.family-controls) cannot be signed with a
# free Personal Team. Set DEVELOPMENT_TEAM in Config.xcconfig, or pick your team on ALL FOUR
# targets in Xcode > Signing & Capabilities.
#
# Targets
#   Unrot              the app (same code as the free build, UnrotScreenTime = YES)
#   UnrotMonitor       DeviceActivityMonitor extension: re-locks apps when bought scroll time
#                      runs out and ends unrot sessions, even while unrot is closed
#   UnrotShield        ShieldConfiguration extension: the "Brainrot blocked" screen
#   UnrotShieldAction  ShieldAction extension: what the shield's buttons do
# All four share the App Group group.$(BUNDLE_PREFIX).unrot so they see the same selections.
#
# Everything shared with the free build lives in project.common.yml.

name: UnrotScreenTime

include:
  - project.common.yml

settings:
  base:
    UNROT_SCREEN_TIME: "YES"

targets:
  Unrot:
    info:
      path: Generated/UnrotScreenTime/Unrot-Info.plist
    entitlements:
      path: App/Unrot.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).unrot
    dependencies:
      # App extensions are embedded into Unrot.app/PlugIns (embed defaults to true for apps).
      - target: UnrotMonitor
      - target: UnrotShield
      - target: UnrotShieldAction

  UnrotMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnrotMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: UnrotMonitor
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).unrot.monitor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/UnrotScreenTime/UnrotMonitor-Info.plist
      properties:
        CFBundleDisplayName: unrot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UnrotAppGroup: group.$(BUNDLE_PREFIX).unrot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: UnrotMonitor/UnrotMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).unrot

  UnrotShield:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnrotShield        # includes Assets.xcassets with the ShieldIcon image
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: UnrotShield
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).unrot.shield
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/UnrotScreenTime/UnrotShield-Info.plist
      properties:
        CFBundleDisplayName: unrot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UnrotAppGroup: group.$(BUNDLE_PREFIX).unrot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: UnrotShield/UnrotShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).unrot

  UnrotShieldAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UnrotShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: UnrotShieldAction
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).unrot.shieldaction
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/UnrotScreenTime/UnrotShieldAction-Info.plist
      properties:
        CFBundleDisplayName: unrot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UnrotAppGroup: group.$(BUNDLE_PREFIX).unrot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: UnrotShieldAction/UnrotShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).unrot
