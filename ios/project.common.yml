# project.common.yml - the part of the XcodeGen spec that BOTH builds share.
#
# Do not run xcodegen on this file directly. It is pulled in by
#   project.yml             -> Unrot.xcodeproj            (free build, no Screen Time)
#   project.screentime.yml  -> UnrotScreenTime.xcodeproj  (real app blocking, paid account)
# through XcodeGen's `include:`. Included dictionaries are merged key by key, so each of those
# files only adds what is different (project name, Info.plist path, entitlements, extensions).
# Spec reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Config.xcconfig holds BUNDLE_PREFIX and DEVELOPMENT_TEAM (the only things you edit).
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    # Swift 5 language mode. The code needs the Swift 5.9 compiler or newer (Xcode 15+);
    # SWIFT_VERSION only accepts language modes (4, 4.2, 5, 6), so "5.9" would be rejected.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # TARGETED_DEVICE_FAMILY is NOT set here: XcodeGen's iOS target preset sets '1,2' on every
    # target, which would override a project-level value. Each target sets "1" (iPhone only).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden to YES by project.screentime.yml. Copied into Info.plist as UnrotScreenTime.
    UNROT_SCREEN_TIME: "NO"

fileGroups:
  - README.md

targets:
  Unrot:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        # The app entitlements file is only used by the Screen Time build, which points
        # CODE_SIGN_ENTITLEMENTS at it. Keep it out of the free project entirely.
        excludes:
          - "*.entitlements"
      - path: Shared
      # The whole web app, copied as a folder reference so the bundle keeps the folder:
      # Unrot.app/web/unrot/index.html, Unrot.app/web/unrot/fonts/..., ...
      # It must NOT land at Unrot.app/unrot: the app executable is Unrot.app/Unrot, and macOS
      # (where Xcode builds) has a case-insensitive file system, so a folder "unrot" next to the
      # executable "Unrot" is the same path and the build fails. Hence the "web" subfolder.
      - path: ../unrot
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: web
    settings:
      base:
        PRODUCT_NAME: Unrot
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).unrot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
    # Generated by XcodeGen on every `xcodegen generate`. The path is set per build in
    # project.yml / project.screentime.yml so the two projects never overwrite each other.
    info:
      properties:
        CFBundleDisplayName: unrot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Side quests use <input type="file" accept="image/*" capture="environment">.
        NSCameraUsageDescription: "unrot uses the camera so you can snap a photo for a Side Quest. Photos stay on your iPhone."
        NSPhotoLibraryUsageDescription: "unrot lets you choose a photo for a Side Quest. Photos stay on your iPhone."
        # Read at runtime by ScreenTimeManager: "NO" in the free build, "YES" in the Screen Time build.
        UnrotScreenTime: $(UNROT_SCREEN_TIME)
        # Shared by the app and its extensions (the group itself only exists in the Screen Time build).
        UnrotAppGroup: group.$(BUNDLE_PREFIX).unrot
    # Creates a shared scheme called "Unrot" (used by CI: xcodebuild -scheme Unrot).
    scheme: {}
